<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帮步 Bamboo · 竹影</title>
<!--
  帮步 Bamboo · 竹影（四件套之 3/4）
  单文件、零外部依赖、零 CDN、零构建工具，双击即可运行。
  公共契约：数据结构 / 状态机 / 数据层 / 种子数据 / localStorage 键 / 根容器 / CSS 前缀 均按提示词 4.x 原样实现。
-->
<style>
/* ============================================================
   竹影样式：默认即大字 + 高对比（黑底黄字 15.8:1）
   所有字体一律无衬线；字号只改 :root 变量。
   ============================================================ */
:root{
  /* 竹影只有无衬线黑体，禁止任何衬线字体 */
  --lv-font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",
             "Noto Sans CJK SC",sans-serif;
  /* 大字高对比档（默认） */
  --lv-bg:#000000; --lv-fg:#FFD400; --lv-card:#111111;
  --lv-line:#FFD400; --lv-focus:#FFFFFF;
  --lv-fs-title:30px; --lv-fs-sub:26px; --lv-fs-body:22px; --lv-fs-small:18px;
  --lv-btn-h:72px; --lv-gap:16px;
  /* 本端补充变量（照片占位 / 盲道状态色，均配文字+图标，不单靠颜色） */
  --lv-ph-bg:#1E1E1E; --lv-ph-fg:#FFD400;
  --lv-ok:#69F0AE; --lv-part:#FFD400; --lv-occ:#FF8A80; --lv-unk:#FFFFFF;
  color-scheme:dark;
}
/* 常规档（html 标签切换 class="lv-regular" 生效）：黑字白底，对比度仍 ≥4.5:1 */
html.lv-regular{
  --lv-bg:#FFFFFF; --lv-fg:#1A1A1A; --lv-card:#F7F7F7; --lv-line:#8A8A8A;
  --lv-focus:#0B57D0;
  --lv-fs-title:26px; --lv-fs-sub:22px; --lv-fs-body:20px; --lv-fs-small:16px;
  --lv-btn-h:56px;
  --lv-ph-bg:#E6E6E6; --lv-ph-fg:#1A1A1A;
  --lv-ok:#0B6B2F; --lv-part:#7A4E00; --lv-occ:#A31515; --lv-unk:#333333;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto;}
body{
  margin:0;padding:0;
  background:var(--lv-bg);
  color:var(--lv-fg);
  font-family:var(--lv-font);
  font-size:var(--lv-fs-body);
  line-height:1.7;
  overflow-wrap:break-word;
  word-break:normal;
}
button,input{font-family:var(--lv-font);}
[hidden]{display:none !important;}
body.lowvis-locked{overflow:hidden;}

/* 仅供读屏的播报节点 / 说明文本 */
.lowvis-sr{
  position:absolute !important;
  width:1px;height:1px;
  margin:-1px;padding:0;
  overflow:hidden;
  clip:rect(0 0 0 0);
  white-space:nowrap;
  border:0;
}

#view-lowvis{
  max-width:900px;
  margin:0 auto;
  padding:20px var(--lv-gap) 64px;
}
#view-lowvis :focus-visible{
  outline:4px solid var(--lv-focus);
  outline-offset:3px;
}

/* ---------- 顶栏 ---------- */
.lowvis-header{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  border-bottom:4px solid var(--lv-line);
  padding-bottom:14px;
  margin-bottom:20px;
}
.lowvis-title{
  margin:0;
  font-size:var(--lv-fs-title);
  line-height:1.35;
  font-weight:800;
  flex:1 1 300px;
}
.lowvis-tools{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:stretch;
}

/* ---------- 按钮：原生 button，整块热区，大字档 ≥72px ---------- */
.lowvis-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:var(--lv-btn-h);
  margin:0;
  padding:12px 16px;
  font-size:var(--lv-fs-body);
  font-weight:700;
  line-height:1.4;
  text-align:center;
  color:var(--lv-fg);
  background:var(--lv-bg);
  border:3px solid var(--lv-line);
  border-radius:12px;
  cursor:pointer;
  appearance:none;
}
.lowvis-btn-primary{
  background:var(--lv-fg);
  color:var(--lv-bg);
  border-color:var(--lv-fg);
}
.lowvis-btn-tool{
  width:auto;
  min-width:0;
  flex:0 1 auto;
}
@media (hover:hover){
  .lowvis-btn:hover,.lowvis-identity-menu a:hover{text-decoration:underline;}
}

/* ---------- 切换身份菜单 ---------- */
.lowvis-identity{position:relative;}
.lowvis-identity-menu{
  position:absolute;
  z-index:60;
  top:calc(100% + 8px);
  right:0;
  min-width:300px;
  max-width:min(92vw,420px);
  margin:0;
  padding:10px;
  background:var(--lv-card);
  border:3px solid var(--lv-line);
  border-radius:12px;
}
.lowvis-identity-menu ul{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.lowvis-identity-menu a{
  display:flex;
  align-items:center;
  min-height:var(--lv-btn-h);
  padding:10px 14px;
  font-size:var(--lv-fs-body);
  font-weight:700;
  color:var(--lv-fg);
  background:var(--lv-bg);
  border:3px solid var(--lv-line);
  border-radius:10px;
  text-decoration:none;
}
.lowvis-identity-menu a[aria-current="page"]{
  background:var(--lv-fg);
  color:var(--lv-bg);
  border-color:var(--lv-fg);
}

/* ---------- 状态行 ---------- */
.lowvis-status{
  margin:0 0 8px;
  font-size:var(--lv-fs-sub);
  font-weight:800;
  line-height:1.5;
}
.lowvis-sub{
  margin:0 0 14px;
  font-size:var(--lv-fs-small);
}

/* ---------- 定位失败时的手动查询 ---------- */
.lowvis-fallback{
  margin:0 0 20px;
  padding:var(--lv-gap);
  background:var(--lv-card);
  border:3px solid var(--lv-line);
  border-radius:12px;
}
.lowvis-fallback-title{
  margin:0 0 12px;
  font-size:var(--lv-fs-sub);
  line-height:1.5;
}
.lowvis-search{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.lowvis-search label{
  font-size:var(--lv-fs-body);
  font-weight:700;
}
.lowvis-input{
  width:100%;
  min-height:var(--lv-btn-h);
  padding:12px 14px;
  font-size:var(--lv-fs-body);
  font-weight:700;
  color:var(--lv-fg);
  background:var(--lv-bg);
  border:3px solid var(--lv-line);
  border-radius:12px;
  appearance:none;
}

/* ---------- 列表 ---------- */
.lowvis-section-title{
  margin:20px 0 14px;
  font-size:var(--lv-fs-sub);
  font-weight:800;
  line-height:1.4;
}
.lowvis-list{
  display:flex;
  flex-direction:column;
  gap:20px;
}
.lowvis-card{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:var(--lv-gap);
  background:var(--lv-card);
  border:2px solid var(--lv-line);
  border-radius:14px;
}
.lowvis-card-title{
  margin:0;
  font-size:var(--lv-fs-title);
  font-weight:800;
  line-height:1.35;
}
.lowvis-card-meta{
  margin:0;
  font-size:var(--lv-fs-body);
  font-weight:700;
}
.lowvis-empty{
  margin:0;
  padding:20px;
  font-size:var(--lv-fs-body);
  font-weight:700;
  border:3px dashed var(--lv-line);
  border-radius:12px;
}
.lowvis-soon{
  margin:0;
  padding:14px 16px;
  font-size:var(--lv-fs-body);
  font-weight:700;
  border:3px dashed var(--lv-line);
  border-radius:12px;
}

/* 盲道状态：图标 + 文字 + 颜色 三者并用 */
.lowvis-blind{
  display:inline-flex;
  align-items:center;
  align-self:flex-start;
  gap:8px;
  margin:0;
  padding:8px 14px;
  font-size:var(--lv-fs-sub);
  font-weight:800;
  line-height:1.4;
  border:3px solid currentColor;
  border-radius:10px;
}
.lowvis-blind--ok{color:var(--lv-ok);}
.lowvis-blind--part{color:var(--lv-part);}
.lowvis-blind--occ{color:var(--lv-occ);}
.lowvis-blind--unk{color:var(--lv-unk);}

/* ---------- 照片：核心信息，可点开全屏放大 ---------- */
.lowvis-photo{margin:0;}
.lowvis-photo-btn{
  display:block;
  width:100%;
  margin:0;
  padding:0;
  background:var(--lv-bg);
  border:3px solid var(--lv-line);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
}
.lowvis-photo-img{
  display:block;
  width:100%;
  height:auto;
  max-height:60vh;
  object-fit:contain;
  background:var(--lv-bg);
}
.lowvis-photo-ph{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:200px;
  padding:20px;
  font-size:var(--lv-fs-sub);
  font-weight:800;
  text-align:center;
  color:var(--lv-ph-fg);
  background:var(--lv-ph-bg);
}
.lowvis-photo-hint{
  display:block;
  padding:8px 10px;
  font-size:var(--lv-fs-small);
  font-weight:700;
  color:var(--lv-fg);
  background:var(--lv-bg);
  border-top:3px solid var(--lv-line);
}

/* ---------- 演示数据标注 / 播放中三重反馈 ---------- */
.lowvis-demo-tag{
  align-self:flex-start;
  margin:0;
  padding:6px 12px;
  font-size:var(--lv-fs-small);
  font-weight:800;
  border:3px dashed var(--lv-line);
  border-radius:8px;
}
.lowvis-playing{
  margin:0;
  padding:10px 12px;
  font-size:var(--lv-fs-sub);
  font-weight:800;
  line-height:1.5;
  border:3px solid currentColor;
  border-radius:8px;
}
.lowvis-card.is-playing{
  background:var(--lv-fg);
  color:var(--lv-bg);
  border-color:var(--lv-fg);
  border-width:3px;
}
/* 待确认播放（第一次点按后的「就绪」态）：不反色，用 3px 焦点色边框 + 文字提示 */
.lowvis-card.is-ready{
  border:3px solid var(--lv-focus);
}
.lowvis-card.is-playing .lowvis-blind,
.lowvis-card.is-playing .lowvis-demo-tag{
  color:var(--lv-bg);
  border-color:var(--lv-bg);
}
.lowvis-card.is-playing .lowvis-photo-btn,
.lowvis-card.is-playing .lowvis-btn{
  color:var(--lv-fg);
  background:var(--lv-bg);
  border-color:var(--lv-bg);
}
.lowvis-card.is-playing .lowvis-photo-ph{
  color:var(--lv-fg);
  background:var(--lv-bg);
}
.lowvis-card.is-playing .lowvis-photo-hint{
  color:var(--lv-fg);
  background:var(--lv-bg);
  border-top-color:var(--lv-bg);
}

/* ---------- 按钮组：单列通栏 ---------- */
.lowvis-actions{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin:0;
}

/* ---------- 详情页 ---------- */
.lowvis-detail{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.lowvis-detail-title{
  margin:0;
  font-size:var(--lv-fs-title);
  font-weight:800;
  line-height:1.35;
}
.lowvis-h3{
  margin:8px 0 0;
  font-size:var(--lv-fs-sub);
  font-weight:800;
  line-height:1.5;
}
.lowvis-ai-text{
  margin:0;
  font-size:var(--lv-fs-body);
  line-height:1.8;
}

/* ---------- 全屏照片查看层 ---------- */
.lowvis-viewer{
  position:fixed;
  inset:0;
  z-index:120;
  display:flex;
  flex-direction:column;
  overflow:auto;
  padding:16px;
  background:var(--lv-bg);
}
.lowvis-viewer-panel{
  display:flex;
  flex-direction:column;
  gap:12px;
  width:100%;
  max-width:1000px;
  margin:0 auto;
}
.lowvis-viewer-title{
  margin:0;
  font-size:var(--lv-fs-sub);
  font-weight:800;
  line-height:1.5;
}
.lowvis-viewer-stage{
  max-height:44vh;
  overflow:auto;
  display:block;
  background:var(--lv-bg);
  border:3px solid var(--lv-line);
  border-radius:12px;
  touch-action:pan-x pan-y;
}
.lowvis-viewer-stage img{
  display:block;
  width:100%;
  max-width:none;
  height:auto;
}
.lowvis-viewer-ph{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:36vh;
  padding:20px;
  font-size:var(--lv-fs-sub);
  font-weight:800;
  text-align:center;
  color:var(--lv-ph-fg);
  background:var(--lv-ph-bg);
}
.lowvis-viewer-desc{
  margin:0;
  font-size:var(--lv-fs-body);
  line-height:1.8;
}
.lowvis-viewer-zoom{
  margin:0;
  font-size:var(--lv-fs-body);
  font-weight:800;
}
.lowvis-viewer-actions{
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* ---------- 自制确认弹窗 ---------- */
.lowvis-modal{
  position:fixed;
  inset:0;
  z-index:140;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:auto;
  padding:20px;
  background:var(--lv-bg);
}
.lowvis-modal-panel{
  display:flex;
  flex-direction:column;
  gap:16px;
  width:100%;
  max-width:560px;
  padding:20px;
  background:var(--lv-card);
  border:4px solid var(--lv-line);
  border-radius:16px;
}
.lowvis-modal-title{
  margin:0;
  font-size:var(--lv-fs-sub);
  font-weight:800;
  line-height:1.5;
}
.lowvis-modal-desc{
  margin:0;
  font-size:var(--lv-fs-body);
  font-weight:700;
}
.lowvis-modal-actions{
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* ---------- 动效：全站无闪烁/无装饰动画 ---------- */
@media (prefers-reduced-motion: reduce){
  #view-lowvis *,
  #view-lowvis *::before,
  #view-lowvis *::after{
    animation:none !important;
    transition:none !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>
<body>
<div role="note" style="position:relative;z-index:9999;padding:14px 18px;background:#fff1bf;color:#342800;font:600 16px/1.6 system-ui,sans-serif;border-bottom:2px solid #a47800">新版界面预览：当前路标、投稿和审核只保存在本机浏览器，未接入云端，请勿用于实际出行或正式投稿。<a href="../index.html" style="color:#173e2b;text-decoration:underline;margin-left:8px">返回云端正式版</a></div>

<div id="view-lowvis" class="view">

  <noscript>
    <p class="lowvis-soon">本页需要 JavaScript 才能加载路标数据，请在浏览器中开启 JavaScript 后刷新。</p>
  </noscript>

  <header class="lowvis-header">
    <h1 class="lowvis-title" id="lowvis-app-title">帮步 Bamboo · 竹影</h1>
    <div class="lowvis-tools">
      <button type="button" id="lowvis-contrast" class="lowvis-btn lowvis-btn-tool" aria-pressed="true">常规 / 高对比：高对比</button>
      <button type="button" id="lowvis-audio-mode-btn" class="lowvis-btn lowvis-btn-tool">播放方式：未选择</button>
      <div class="lowvis-identity" id="lowvis-identity">
        <button type="button" id="lowvis-identity-btn" class="lowvis-btn lowvis-btn-tool"
                aria-expanded="false" aria-haspopup="true" aria-controls="lowvis-identity-menu">切换身份</button>
        <nav id="lowvis-identity-menu" class="lowvis-identity-menu" aria-label="切换身份" hidden>
          <ul id="lowvis-identity-list"></ul>
        </nav>
      </div>
    </div>
  </header>

  <main class="lowvis-main">
    <p id="lowvis-status" class="lowvis-status" role="status" aria-live="polite">正在加载路标…</p>
    <p id="lowvis-coords" class="lowvis-sub"></p>

    <section id="lowvis-locate-fallback" class="lowvis-fallback" aria-labelledby="lowvis-fallback-title" hidden>
      <h2 id="lowvis-fallback-title" class="lowvis-fallback-title">定位未开启，请在下方输入地点名称</h2>
      <form id="lowvis-search-form" class="lowvis-search" novalidate>
        <label id="lowvis-search-label" for="lowvis-search-input">地点名称（例如：人民广场）</label>
        <input id="lowvis-search-input" class="lowvis-input" type="text" autocomplete="off"
               enterkeyhint="search" placeholder="输入地名，例如：人民广场">
        <button type="submit" id="lowvis-search-btn" class="lowvis-btn lowvis-btn-primary">查询</button>
        <button type="button" id="lowvis-showall-btn" class="lowvis-btn">显示全部路标</button>
      </form>
    </section>

    <h2 id="lowvis-list-title" class="lowvis-section-title" tabindex="-1">附近路标（按距离由近到远）</h2>
    <div id="lowvis-list" class="lowvis-list"></div>

    <section id="lowvis-detail" class="lowvis-detail" aria-labelledby="lowvis-detail-title" hidden>
      <button type="button" id="lowvis-back-top" class="lowvis-btn">返回列表</button>
      <h2 id="lowvis-detail-title" class="lowvis-detail-title" tabindex="-1"></h2>
      <p id="lowvis-detail-meta" class="lowvis-card-meta"></p>
      <p id="lowvis-detail-blind" class="lowvis-blind lowvis-blind--unk"></p>
      <div id="lowvis-detail-photo"></div>
      <h3 id="lowvis-transcript-title" class="lowvis-h3" tabindex="-1">志愿者原声文字稿</h3>
      <p id="lowvis-detail-text" class="lowvis-ai-text"></p>
      <h3 id="lowvis-photo-desc-title" class="lowvis-h3">AI 图片描述</h3>
      <p id="lowvis-detail-photo-desc" class="lowvis-ai-text"></p>
      <p id="lowvis-detail-submitted" class="lowvis-sub"></p>
      <p id="lowvis-detail-demo" class="lowvis-demo-tag" hidden>演示数据 · 原声占位</p>
      <p id="lowvis-detail-playing" class="lowvis-playing" hidden>✓ 已选中：正在播放这条原声</p>
      <div class="lowvis-actions">
        <button type="button" id="lowvis-detail-listen" class="lowvis-btn lowvis-btn-primary">听志愿者原声</button>
        <button type="button" id="lowvis-detail-inaccurate" class="lowvis-btn">标记不准</button>
        <button type="button" id="lowvis-detail-accurate" class="lowvis-btn">标记准确</button>
        <button type="button" id="lowvis-back-bottom" class="lowvis-btn">返回列表</button>
      </div>
    </section>
  </main>

  <!-- 全屏照片查看层 -->
  <div id="lowvis-viewer" class="lowvis-viewer" role="dialog" aria-modal="true"
       aria-labelledby="lowvis-viewer-title" hidden>
    <div id="lowvis-viewer-panel" class="lowvis-viewer-panel">
      <h2 id="lowvis-viewer-title" class="lowvis-viewer-title">照片放大查看</h2>
      <div id="lowvis-viewer-stage" class="lowvis-viewer-stage"></div>
      <p id="lowvis-viewer-desc" class="lowvis-viewer-desc"></p>
      <p id="lowvis-viewer-zoom" class="lowvis-viewer-zoom">当前放大：1 倍</p>
      <div class="lowvis-viewer-actions">
        <button type="button" id="lowvis-zoom-in" class="lowvis-btn">放大</button>
        <button type="button" id="lowvis-zoom-out" class="lowvis-btn">缩小</button>
        <button type="button" id="lowvis-zoom-close" class="lowvis-btn lowvis-btn-primary">关闭</button>
      </div>
    </div>
  </div>

  <!-- 自制确认弹窗（不使用 alert / confirm） -->
  <div id="lowvis-modal" class="lowvis-modal" role="dialog" aria-modal="true"
       aria-labelledby="lowvis-modal-title" aria-describedby="lowvis-modal-desc" hidden>
    <div id="lowvis-modal-panel" class="lowvis-modal-panel">
      <h2 id="lowvis-modal-title" class="lowvis-modal-title">确认反馈：这条路标信息不准确？</h2>
      <p id="lowvis-modal-desc" class="lowvis-modal-desc"></p>
      <div class="lowvis-modal-actions">
        <button type="button" id="lowvis-modal-confirm" class="lowvis-btn lowvis-btn-primary">确认</button>
        <button type="button" id="lowvis-modal-cancel" class="lowvis-btn">取消</button>
      </div>
    </div>
  </div>

  <!-- 播放方式选择（首次播放前询问一次，也可从顶栏随时改） -->
  <div id="lowvis-audio-modal" class="lowvis-modal" role="dialog" aria-modal="true"
       aria-labelledby="lowvis-audio-title" aria-describedby="lowvis-audio-desc" hidden>
    <div id="lowvis-audio-panel" class="lowvis-modal-panel">

  const BambooDB=(()=>{
    const LS='app_bamboo_marks', DBN='app_bamboo_media';
    const API={ base:'local', setBase(b){this.base=b;} };
    function load(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
    function persist(l){localStorage.setItem(LS,JSON.stringify(l))}
    function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);
      r.onupgradeneeded=()=>r.result.createObjectStore('media');
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);})}
    async function putMedia(key,blob){const db=await idb();
      return new Promise((res,rej)=>{const tx=db.transaction('media','readwrite');
        tx.objectStore('media').put(blob,key); tx.oncomplete=()=>res(key);
        tx.onerror=()=>rej(tx.error);})}
    async function getMedia(key){const db=await idb();
      return new Promise((res,rej)=>{const tx=db.transaction('media','readonly');
        const rq=tx.objectStore('media').get(key);
        rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);})}
    function aiReview(m){
      const flags=[];
      if(!m.audio||!m.audio.duration||m.audio.duration<20)flags.push('录音时长不足');
      if(m.blindPath&&m.blindPath.status==='未知')flags.push('盲道状态模糊');
      if(!m.place||m.place.length<2)flags.push('点位名称不完整');
      if(!m.audio||!m.audio.duration)flags.push('文字替代录音');
      return{verdict:flags.length?'unsure':'pass',flags};
    }
    async function saveMark(m){
      m.aiReview=aiReview(m);
      m.state=m.aiReview.verdict==='pass'?'published':'queue';
      m.humanReview={status:null,reviewer:null,tags:[],note:null,reviewedAt:null};
      const l=load();const i=l.findIndex(x=>x.id===m.id);
      if(i>-1){l[i]=m}else{m.usage=m.usage||{listens:0,confirm:0,inaccurate:0};l.unshift(m)}
      persist(l);return m;
    }
    async function updateMark(id,patch){const l=load();const m=l.find(x=>x.id===id);
      if(m){Object.assign(m,patch);persist(l)}return m}
    async function listMarks(f){let l=load();
      if(f&&f.state)l=l.filter(m=>m.state===f.state);return l}
    async function markInaccurate(id){const l=load();const m=l.find(x=>x.id===id);
      if(m&&m.state==='published'){m.usage.inaccurate++;
        m.aiReview.flags=['视障用户反馈不准'];m.state='queue';persist(l)}return m}
    return{API,load,persist,listMarks,saveMark,updateMark,markInaccurate,putMedia,getMedia};

      // 1. 首次：没有任何数据 → 写入全部种子（原 6 条 + 新 8 条）
      localStorage.setItem('app_bamboo_marks',JSON.stringify(ALL_SEEDS));
    }else if(ver<SEED_VER){
      // 2. 已有数据且种子版本旧 → 只追加 id 不存在的种子，
      //    绝不覆盖、绝不删除已存在的记录（用户真实提交/审核过的数据原样保留）
      const have=new Set(marks.map(function(m){return m.id;}));
      ALL_SEEDS.forEach(function(s){if(!have.has(s.id))marks.push(s);});
      localStorage.setItem('app_bamboo_marks',JSON.stringify(marks));
    }

    localStorage.setItem('app_bamboo_seed_ver',String(SEED_VER));

  /* ---------- 小工具 ---------- */
  function el(tag,attrs,children){
    const n=document.createElement(tag);
    if(attrs){
      Object.keys(attrs).forEach(function(k){
        const v=attrs[k];
        if(v===undefined||v===null) return;
        if(k==='class') n.className=v;
        else if(k==='text') n.textContent=v;
        else if(k==='dataset'){Object.keys(v).forEach(function(d){n.dataset[d]=v[d];});}
        else n.setAttribute(k,v);
      });
    }
    if(children){
      (Array.isArray(children)?children:[children]).forEach(function(c){
        if(c===null||c===undefined) return;
        n.appendChild(typeof c==='string'?document.createTextNode(c):c);
      });
    }
    return n;
  }
  function on(target,type,fn,opts){
    target.addEventListener(type,fn,opts);
    listeners.push([target,type,fn,opts]);
  }
  function announce(msg){
    if(!els.live) return;
    if(announceTimer){clearTimeout(announceTimer);announceTimer=null;}
    els.live.textContent='';

  function revokeReg(reg){
    reg.cancelled=true;

    reg.urls.length=0;

    if(m&&m.photo&&m.photo.aiText) return m.photo.aiText;

  function haversine(lat1,lng1,lat2,lng2){
    const R=6371000;
    const rad=function(x){return x*Math.PI/180;};
    const dLat=rad(lat2-lat1), dLng=rad(lng2-lng1);
    const a=Math.sin(dLat/2)*Math.sin(dLat/2)+
            Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
    return 2*R*Math.asin(Math.sqrt(a));
  }
  function distanceTo(m){
    if(!state.ref||typeof m.lat!=='number'||typeof m.lng!=='number') return null;
    return haversine(state.ref.lat,state.ref.lng,m.lat,m.lng);
  }
  function fmtDistance(m){
    if(m<10) return '就在此处';
    if(m<990) return '约'+(Math.round(m/10)*10)+'米';
    if(m<1000) return '约1.0公里';
    return '约'+(m/1000).toFixed(1)+'公里';
  }
  function fmtCoord(v){return Number(v).toFixed(5);}
  function fmtDate(ts){
    const d=new Date(ts);
    if(isNaN(d.getTime())) return '未知';
    return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
  }
  function fmtScale(s){
    const r=Math.round(s*10)/10;
    return (r%1===0)?String(r):r.toFixed(1);
  }

  /* ---------- 设置：主题 + 播放方式，一起存 app_bamboo_settings ---------- */
  function loadSettings(){
    try{
      const raw=localStorage.getItem('app_bamboo_settings');
      const s=raw?JSON.parse(raw):null;
      return (s&&typeof s==='object')?s:{};
    }catch(e){return {};}
  }
  function loadTheme(){

  function applyTheme(mode,announceIt){
    state.theme=mode;

      els.contrastBtn.setAttribute('aria-pressed',mode==='high'?'true':'false');
      els.contrastBtn.textContent=(mode==='high'
        ?'常规 / 高对比：高对比'

      announce(mode==='high'
        ?'已切换到高对比模式：黑底黄字，大字号'
        :'已切换到常规模式：白底黑字');

  function chooseAudioMode(mode){
    const info=state.audioModePrompt;

    if(info.firstTime){
      // 第一次：先收起选择弹窗，再弹「是否确定？」

      els.modeConfirmDesc.textContent=(mode==='sr'?CONFIG.modeConfirmSR:CONFIG.modeConfirmSpeaker);

  /* ---------- 定位 ---------- */
  function locate(){
    if(!navigator.geolocation){onLocateFail();return;}
    let settled=false;
    const finish=function(ok,pos){
      if(settled) return;
      settled=true;
      if(geoGuard){clearTimeout(geoGuard);geoGuard=null;}
      if(ok&&pos&&pos.coords) onLocateSuccess(pos);
      else onLocateFail();
    };
    geoGuard=setTimeout(function(){finish(false);},9000);
    try{
      navigator.geolocation.getCurrentPosition(
        function(pos){finish(true,pos);},
        function(){finish(false);},
        {enableHighAccuracy:false,timeout:8000,maximumAge:60000}
      );
    }catch(e){finish(false);}
  }
  function onLocateSuccess(pos){
    state.locateFailed=false;
    state.ref={
      lat:pos.coords.latitude,
      lng:pos.coords.longitude,
      label:CONFIG.locatePlaceName,
      source:'geo'
    };
    els.coords.textContent='坐标 '+fmtCoord(state.ref.lat)+', '+fmtCoord(state.ref.lng)
      +' ｜ 按直线距离由近到远排列';
    syncFallback();
    renderList();
    updateStatus();
  }
  function onLocateFail(){
    state.locateFailed=true;
    state.ref=null;
    els.coords.textContent='';
    syncFallback();
    updateStatus();
  }
  function syncFallback(){
    els.fallback.hidden=!(state.locateFailed&&!state.detailOpen);
  }

  /* ---------- 状态文案（aria-live polite） ---------- */
  function updateStatus(){
    const n=visibleMarks().length;
    let text='';
    if(state.ref&&state.ref.source==='geo'){
      text=CONFIG.locatedNear.replace('{place}',CONFIG.locatePlaceName).replace('{n}',String(n));
    }else if(state.ref&&state.ref.source==='search'){
      text=CONFIG.foundNear.replace('{place}',state.ref.label).replace('{n}',String(n));
    }else if(state.locateFailed){
      text=CONFIG.locateFail;
    }else{
      text='正在获取定位，请稍候…';
    }
    els.status.textContent=text;
  }

  /* ---------- 列表数据 ---------- */
  function visibleMarks(){
    let arr=state.marks.slice();
    if(state.query){
      const q=state.query;
      arr=arr.filter(function(m){return m.place.indexOf(q)>-1;});
    }
    if(state.ref){
      arr.sort(function(a,b){
        const da=distanceTo(a), db=distanceTo(b);
        if(da===null||db===null) return 0;
        return (da-db)||((b.submittedAt||0)-(a.submittedAt||0));
      });
    }else{
      arr.sort(function(a,b){return (b.submittedAt||0)-(a.submittedAt||0);});
    }
    return arr;
  }

  /* ---------- 列表渲染 ---------- */
  function renderList(){
    revokeReg(cardReg);
    cardReg=makeReg();
    cardRefs.clear();
    els.list.textContent='';
    els.listTitle.textContent=state.ref?CONFIG.listTitle:CONFIG.listTitleNoRef;

    const items=visibleMarks();
    // 若正在播放 / 已就绪的路标被筛选或反馈移出列表，立即停止，避免出现「看不见的播放器」
    if(state.playing&&!(state.detailOpen&&state.selectedId===state.playing.id)){
      const stillListed=items.some(function(m){return m.id===state.playing.id;});
      if(!stillListed) stopPlayback(false);
    }
    if(state.ready&&!(state.detailOpen&&state.selectedId===state.ready.id)){
      const stillReady=items.some(function(m){return m.id===state.ready.id;});
      if(!stillReady){state.ready=null;}
    }
    if(!items.length){
      const p=el('p',{class:'lowvis-empty'});
      p.textContent=state.query
        ?'没有找到包含「'+state.query+'」的已发布路标。'
        :'暂无可显示的已发布路标。';
      els.list.appendChild(p);
      appendSoonNote();
      return;
    }
    const frag=document.createDocumentFragment();
    items.forEach(function(m){frag.appendChild(buildCard(m));});
    els.list.appendChild(frag);
    appendSoonNote();
    updatePlayingUI();
  }

  /* 声音明信片：本端不做，仅占位 */
  function appendSoonNote(){
    const p=el('p',{class:'lowvis-soon'});
    p.textContent=CONFIG.soonText;
    els.list.appendChild(p);
  }

  function buildCard(m){
    const dist=distanceTo(m);
    const card=el('article',{class:'lowvis-card','aria-labelledby':'lowvis-place-'+m.id});

    card.appendChild(el('h2',{class:'lowvis-card-title',id:'lowvis-place-'+m.id,text:m.place}));

    const meta=el('p',{class:'lowvis-card-meta'});
    meta.textContent=(dist===null?'距离：未知（未定位）':'距离：'+fmtDistance(dist))
      +' ｜ 编号：'+m.id;
    card.appendChild(meta);

    const status=(m.blindPath&&m.blindPath.status)||'未知';
    const blind=el('p',{class:'lowvis-blind '+blindClass(status)});
    blind.textContent=blindText(status);
    card.appendChild(blind);

    card.appendChild(buildPhoto(m,cardReg));

    if(!hasRealAudio(m)){
      const tag=el('p',{class:'lowvis-demo-tag'});
      tag.textContent=CONFIG.demoTag;
      card.appendChild(tag);
    }

    const playingBadge=el('p',{class:'lowvis-playing'});
    playingBadge.textContent='✓ 已选中：正在播放这条原声';
    playingBadge.hidden=true;
    card.appendChild(playingBadge);

    const actions=el('div',{class:'lowvis-actions'});
    const bDetail=el('button',{type:'button',class:'lowvis-btn lowvis-btn-primary'});
    bDetail.textContent=CONFIG.btnDetail;
    const bListen=el('button',{type:'button',class:'lowvis-btn'});
    bListen.textContent=CONFIG.btnListen;
    const bBad=el('button',{type:'button',class:'lowvis-btn'});
    bBad.textContent=CONFIG.btnInaccurate;
    const bAcc=el('button',{type:'button',class:'lowvis-btn'});
    bAcc.textContent=CONFIG.btnAccurate;

    bDetail.addEventListener('click',function(){openDetail(m.id,bDetail);});
    bListen.addEventListener('click',function(){toggleListen(m.id,bListen);});
    bBad.addEventListener('click',function(){openConfirm(m.id,bBad,'inaccurate');});
    bAcc.addEventListener('click',function(){openConfirm(m.id,bAcc,'accurate');});

    actions.appendChild(bDetail);
    actions.appendChild(bListen);
    actions.appendChild(bBad);
    actions.appendChild(bAcc);
    card.appendChild(actions);

    cardRefs.set(m.id,{card:card,playingBadge:playingBadge,listenBtn:bListen,
                        detailBtn:bDetail,badBtn:bBad});
    return card;
  }

  /* ---------- 照片（真实照片走 IndexedDB；种子走占位色块） ---------- */
  function buildPhoto(m,reg){
    const alt=photoAlt(m);
    const btn=el('button',{type:'button',class:'lowvis-photo-btn',
      'aria-label':'放大查看照片：'+alt});
    btn.__media={type:'demo'};

    if(m.photo&&m.photo.mediaKey){
      const ph=el('span',{class:'lowvis-photo-ph','aria-hidden':'true'});
      ph.textContent=CONFIG.loadingPhoto;
      btn.appendChild(ph);
      BambooDB.getMedia(m.photo.mediaKey).then(function(blob){
        if(state.destroyed||reg.cancelled) return;
        if(!blob){
          ph.textContent=CONFIG.photoUnavailable;
          btn.__media={type:'demo'};
          return;
        }
        const url=URL.createObjectURL(blob);
        reg.urls.push(url);
        const img=el('img',{class:'lowvis-photo-img',alt:alt,src:url});
        btn.replaceChild(img,ph);
        btn.__media={type:'img',src:url};
      }).catch(function(){
        if(reg.cancelled) return;
        ph.textContent=CONFIG.photoUnavailable;
        btn.__media={type:'demo'};
      });
    }else{
      const ph=el('span',{class:'lowvis-photo-ph','aria-hidden':'true'});
      ph.textContent=CONFIG.demoImg;
      btn.appendChild(ph);
    }

    const hint=el('span',{class:'lowvis-photo-hint','aria-hidden':'true'});
    hint.textContent=CONFIG.photoHint;
    btn.appendChild(hint);

    btn.addEventListener('click',function(){
      const media={type:btn.__media.type,src:btn.__media.src,alt:alt,desc:photoDesc(m)};
      openViewer(media,btn);
    });

    const fig=el('figure',{class:'lowvis-photo'});
    fig.appendChild(btn);
    return fig;
  }

  /* ---------- 听原声：与系统读屏的协调规则 ----------
     · 首次播放先问「读屏优先 / 扬声器」，之后可在顶栏随时改；
     · 每次播放都要按两次：第一次只显示「就绪」并用 aria-live 提示，
       等读屏把这句念完，用户再按第二次——用人工确认代替猜时间的定时器；
     · 读屏优先模式完全不用 speechSynthesis，种子条目改为把焦点交给文字稿；
     · 播放期间不写 aria-live（否则读屏会同时开口），只保留视觉反馈；
     · 焦点离开播放按钮、按 Esc、页面切后台，立即停止。 */
  function toggleListen(id,trigger){
    const m=findMark(id);
    if(!m) return;
    if(!state.audioMode){
      openAudioModeModal(function(){doListen(id,trigger||null);});
      return;
    }
    doListen(id,trigger||null);
  }

  function doListen(id,trigger){
    const m=findMark(id);
    if(!m) return;

    // 第二次点按 → 真正开始播放
    if(state.ready&&state.ready.id===id){
      state.ready=null;
      updatePlayingUI();
      playMark(id,trigger);
      return;
    }
    if(state.playing&&state.playing.id===id){
      stopPlayback(true);
      return;
    }
    stopPlayback(false);
    state.ready=null;

    // 读屏优先 + 种子条目（没有真实录音）→ 本页不朗读，把文字稿交给读屏
    if(state.audioMode==='sr'&&!hasRealAudio(m)){
      openTranscript(m);
      return;
    }

    // 第一次点按 → 只进入「就绪」，不发声
    state.ready={id:id,trigger:trigger};
    updatePlayingUI();
    announce(CONFIG.readyHint);
  }

  function openTranscript(m){
    if(!state.detailOpen||state.selectedId!==m.id) openDetail(m.id,null);
    if(els.transcriptTitle) els.transcriptTitle.focus();
  }

  function playMark(id,trigger){
    const m=findMark(id);
    if(!m) return;
    // 开始出声前清掉待播报的 polite 文本：避免读屏在音频开始后又念一遍提示造成叠音
    if(announceTimer){clearTimeout(announceTimer);announceTimer=null;}
    if(els.live) els.live.textContent='';

    if(m.audio&&m.audio.mediaKey){
      const token={id:id,trigger:trigger||null,audio:null,utter:null,url:null};
      state.playing=token;
      updatePlayingUI();
      BambooDB.getMedia(m.audio.mediaKey).then(function(blob){
        if(state.destroyed||state.playing!==token) return;
        if(!blob){stopPlayback(false);announce('原声暂不可用');return;}
        const url=URL.createObjectURL(blob);
        token.url=url;
        const audio=document.createElement('audio');
        audio.src=url;
        audio.preload='auto';
        token.audio=audio;
        audio.addEventListener('ended',function(){
          if(state.playing===token) stopPlayback(false);
        });
        const p=audio.play();
        if(p&&p.catch) p.catch(function(){
          if(state.playing===token){stopPlayback(false);announce('播放失败，请再试一次');}
        });
        updatePlayingUI();
      }).catch(function(){
        if(state.playing===token){stopPlayback(false);announce('原声暂不可用');}
      });
      return;
    }

    const text=(m.audio&&m.audio.aiText)?m.audio.aiText:'';
    if(!text){updatePlayingUI();announce('这条路标没有文字稿');return;}
    if(!('speechSynthesis' in window)){updatePlayingUI();announce('当前浏览器不支持语音朗读');return;}
    try{
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang='zh-CN';
      u.rate=0.95;
      const token={id:id,trigger:trigger||null,audio:null,utter:u,url:null};
      state.playing=token;
      u.onend=function(){if(state.playing===token) stopPlayback(false);};
      u.onerror=function(){if(state.playing===token) stopPlayback(false);};
      window.speechSynthesis.speak(u);
      updatePlayingUI();
    }catch(e){
      state.playing=null;
      updatePlayingUI();
      announce('朗读失败，请稍后再试');
    }
  }

  function stopPlayback(announceStop){
    const p=state.playing;
    state.playing=null;
    if(p){
      if(p.utter){
        try{window.speechSynthesis.cancel();}catch(e){}
      }
      if(p.audio){
        try{
          p.audio.pause();
          p.audio.removeAttribute('src');
          p.audio.load();
        }catch(e){}
      }
      if(p.url){try{URL.revokeObjectURL(p.url);}catch(e){}}
    }
    updatePlayingUI();
    if(announceStop) announce('已停止播放');
  }

  function listenLabel(m,playing,ready){
    if(playing) return CONFIG.btnStop;
    if(ready) return CONFIG.btnReady;
    if(state.audioMode==='sr'&&!hasRealAudio(m)) return CONFIG.btnReadTranscript;
    return CONFIG.btnListen;
  }

  function updatePlayingUI(){
    const pid=state.playing?state.playing.id:null;
    const rid=state.ready?state.ready.id:null;
    cardRefs.forEach(function(r,id){
      const m=findMark(id);
      if(!m) return;
      const playing=(id===pid);
      const ready=(id===rid);
      r.card.classList.toggle('is-playing',playing);
      r.card.classList.toggle('is-ready',ready);
      r.playingBadge.hidden=!(playing||ready);
      r.playingBadge.textContent=playing?'✓ 已选中：正在播放这条原声':CONFIG.readyBadge;
      r.listenBtn.textContent=listenLabel(m,playing,ready);
    });
    if(els.detailListen&&state.selectedId){
      const m=findMark(state.selectedId);
      if(!m) return;
      const playing=(pid===state.selectedId);
      const ready=(rid===state.selectedId);
      els.detailListen.textContent=listenLabel(m,playing,ready);
      els.detailPlaying.hidden=!(playing||ready);
      els.detailPlaying.textContent=playing?'✓ 已选中：正在播放这条原声':CONFIG.readyBadge;
    }
  }

  /* ---------- 详情 ---------- */
  function openDetail(id,trigger){
    const m=findMark(id);
    if(!m) return;
    if(state.playing&&state.playing.id!==id) stopPlayback(false);
    if(state.ready&&state.ready.id!==id) state.ready=null;
    state.selectedId=id;
    state.detailOpen=true;
    state.detailTrigger=trigger||null;

    els.listTitle.hidden=true;
    els.list.hidden=true;
    els.fallback.hidden=true;
    els.detail.hidden=false;

    fillDetail(m);
    window.scrollTo(0,0);
    announce('已打开详情：'+m.place);
    if(els.detailTitle) els.detailTitle.focus();
  }

  function fillDetail(m){
    els.detailTitle.textContent=m.place;
    const dist=distanceTo(m);
    els.detailMeta.textContent=
      (dist===null?'距离：未知（未定位）':'距离：'+fmtDistance(dist))+' ｜ 编号：'+m.id;

    const status=(m.blindPath&&m.blindPath.status)||'未知';
    els.detailBlind.className='lowvis-blind '+blindClass(status);
    els.detailBlind.textContent=blindText(status);

    revokeReg(detailReg);
    detailReg=makeReg();
    els.detailPhoto.textContent='';
    els.detailPhoto.appendChild(buildPhoto(m,detailReg));

    els.detailText.textContent=(m.audio&&m.audio.aiText)
      ?m.audio.aiText:'（未提供志愿者原声文字稿）';
    els.detailPhotoDesc.textContent=(m.photo&&m.photo.aiText)
      ?m.photo.aiText:'（未提供图片描述）';

    const submitted=m.submittedAt?fmtDate(m.submittedAt):'未知';
    const checked=(m.blindPath&&m.blindPath.checkedAt)?fmtDate(m.blindPath.checkedAt):'未知';
    els.detailSubmitted.textContent='提交日期：'+submitted+' ｜ 盲道核查日期：'+checked;

    els.detailDemo.hidden=hasRealAudio(m);
    els.detailDemo.textContent=CONFIG.demoTag;

    updatePlayingUI();
  }

  function closeDetail(){
    const trigger=state.detailTrigger;
    state.detailOpen=false;
    state.selectedId=null;
    revokeReg(detailReg);
    detailReg=makeReg();
    els.detail.hidden=true;
    els.detailPhoto.textContent='';
    els.listTitle.hidden=false;
    els.list.hidden=false;
    syncFallback();
    window.scrollTo(0,0);
    if(trigger&&document.contains(trigger)) trigger.focus();
    else if(els.listTitle) els.listTitle.focus();
    announce('已返回路标列表');
  }

  /* ---------- 反馈：标记不准 / 标记准确（共用同一个确认弹窗） ---------- */
  function openConfirm(id,trigger,kind){
    const m=findMark(id);
    if(!m) return;
    const k=(kind==='accurate')?'accurate':'inaccurate';
    state.confirm={id:id,trigger:trigger||null,kind:k};
    els.modalTitle.textContent=(k==='accurate'?CONFIG.confirmAccurateTitle:CONFIG.confirmTitle);
    els.modalDesc.textContent=m.place;
    els.modal.hidden=false;
    lockScroll();
    els.modalConfirm.focus();
    announce('已打开确认弹窗：'+(k==='accurate'
      ?'确认反馈这条路标信息准确？'
      :'确认反馈这条路标信息不准确？'));
  }

  function closeConfirm(){
    const info=state.confirm;
    state.confirm=null;
    els.modal.hidden=true;
    lockScroll();
    if(info&&info.trigger&&document.contains(info.trigger)) info.trigger.focus();
    else if(els.listTitle) els.listTitle.focus();
  }

  function onConfirmClick(){
    const info=state.confirm;
    if(!info) return;
    if(info.kind==='accurate') doMarkAccurate();
    else doMarkInaccurate();
  }

  async function doMarkInaccurate(){
    const info=state.confirm;
    if(!info) return;
    const id=info.id;
    state.confirm=null;
    els.modal.hidden=true;
    lockScroll();

    if(state.playing&&state.playing.id===id) stopPlayback(false);
    if(state.ready&&state.ready.id===id) state.ready=null;

    try{ await BambooDB.markInaccurate(id); }catch(e){}
    try{
      state.marks=await BambooDB.listMarks({state:'published'});
    }catch(e){ state.marks=[]; }

    if(state.detailOpen&&state.selectedId===id){
      state.detailOpen=false;
      state.selectedId=null;
      revokeReg(detailReg);
      detailReg=makeReg();
      els.detail.hidden=true;
      els.detailPhoto.textContent='';
      els.listTitle.hidden=false;
      els.list.hidden=false;
      syncFallback();
    }

    renderList();
    updateStatus();
    announce(CONFIG.feedbackDone);
    if(els.listTitle) els.listTitle.focus();
  }

  /* 标记准确：不改变 state，只累加 usage.confirm；同一条路标本次会话只计一次 */
  async function doMarkAccurate(){
    const info=state.confirm;
    if(!info) return;
    const id=info.id;
    state.confirm=null;
    els.modal.hidden=true;
    lockScroll();
    const m=findMark(id);
    if(!m) return;

    if(state.accurate.has(id)){
      announce(CONFIG.feedbackAccurateDone);
      if(info.trigger&&document.contains(info.trigger)) info.trigger.focus();
      else if(els.listTitle) els.listTitle.focus();
      return;
    }
    state.accurate.add(id);

    const usage=Object.assign({listens:0,confirm:0,inaccurate:0},m.usage||{});
    usage.confirm=(usage.confirm||0)+1;
    try{ await BambooDB.updateMark(id,{usage:usage}); }catch(e){}
    m.usage=usage;

    announce(CONFIG.feedbackAccurateDone);
    if(info.trigger&&document.contains(info.trigger)) info.trigger.focus();
    else if(els.listTitle) els.listTitle.focus();
  }

  /* ---------- 全屏照片查看（放大 / 缩小 / 关闭 + 双指捏合） ---------- */
  function openViewer(media,trigger){
    state.viewer={trigger:trigger||null};
    state.viewerScale=1;
    els.viewerStage.textContent='';
    if(media&&media.type==='img'&&media.src){
      const img=el('img',{alt:media.alt||'',src:media.src});
      els.viewerStage.appendChild(img);
      els.viewerTitle.textContent=CONFIG.viewerTitle;
    }else{
      const ph=el('span',{class:'lowvis-viewer-ph'});
      ph.textContent=CONFIG.demoImg;
      els.viewerStage.appendChild(ph);
      els.viewerTitle.textContent=CONFIG.demoImg+'（放大查看）';
    }
    els.viewerDesc.textContent=media&&media.desc
      ?'图片描述：'+media.desc
      :'（暂无图片描述）';
    setScale(1);
    els.viewer.hidden=false;
    lockScroll();
    els.zoomIn.focus();
    announce('已打开照片放大查看：可用放大、缩小按钮或双指捏合');
  }

  function closeViewer(){
    const trigger=state.viewer?state.viewer.trigger:null;
    state.viewer=null;
    els.viewer.hidden=true;
    els.viewerStage.textContent='';
    lockScroll();
    if(trigger&&document.contains(trigger)) trigger.focus();
    announce('已关闭照片查看');
  }

  function setScale(scale){
    let s=Number(scale);
    if(isNaN(s)) s=1;
    s=Math.min(4,Math.max(1,s));
    state.viewerScale=s;
    const target=els.viewerStage.firstElementChild;
    if(target) target.style.width=(s*100)+'%';
    els.zoomText.textContent='当前放大：'+fmtScale(s)+' 倍';
  }

  function pinchDistance(touches){
    const dx=touches[0].clientX-touches[1].clientX;
    const dy=touches[0].clientY-touches[1].clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }
  function onTouchStart(e){
    if(e.touches&&e.touches.length===2) pinchStart=pinchDistance(e.touches);
    else pinchStart=null;
  }
  function onTouchMove(e){
    if(!pinchStart||!e.touches||e.touches.length!==2) return;
    const d=pinchDistance(e.touches);
    if(!d) return;
    if(e.cancelable) e.preventDefault();
    setScale(state.viewerScale*(d/pinchStart));
    pinchStart=d;
  }
  function onTouchEnd(e){
    if(!e.touches||e.touches.length<2) pinchStart=null;
  }

  /* ---------- 键盘：Esc 关闭 / Tab 焦点锁定 ---------- */
  function trapTab(e,container){
    const nodes=container.querySelectorAll(
      'button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
    const list=[];
    for(let i=0;i<nodes.length;i++){
      const n=nodes[i];
      if(!n.disabled&&n.offsetParent!==null) list.push(n);
    }
    if(!list.length) return;
    const first=list[0], last=list[list.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
  function onKeydown(e){
    const modeConfirmOpen=els.modeConfirm&&!els.modeConfirm.hidden;
    const audioOpen=els.audioModal&&!els.audioModal.hidden;
    const modalOpen=els.modal&&!els.modal.hidden;
    const viewerOpen=els.viewer&&!els.viewer.hidden;
    if(e.key==='Escape'||e.key==='Esc'){
      if(modeConfirmOpen){e.preventDefault();cancelAudioModeConfirm();return;}
      if(audioOpen){e.preventDefault();closeAudioModeModal(true);return;}
      if(modalOpen){e.preventDefault();closeConfirm();return;}
      if(viewerOpen){e.preventDefault();closeViewer();return;}
      if(els.identityMenu&&!els.identityMenu.hidden){e.preventDefault();closeIdentity(true);return;}
      // 没有弹窗时，Esc 停止正在播放/已就绪的音频（读屏用户随时能静音）
      if(state.playing){e.preventDefault();stopPlayback(true);return;}
      if(state.ready){e.preventDefault();state.ready=null;updatePlayingUI();return;}
      return;
    }
    if(e.key==='Tab'){
      if(modeConfirmOpen) trapTab(e,els.modeConfirmPanel);
      else if(audioOpen) trapTab(e,els.audioPanel);
      else if(modalOpen) trapTab(e,els.modalPanel);
      else if(viewerOpen) trapTab(e,els.viewerPanel);
    }
  }

  /* 焦点一离开播放按钮就停止：读屏用户移动焦点时读屏会开口，及时静音避免叠音 */
  function onFocusIn(e){
    if(state.playing){
      const trig=state.playing.trigger;
      if(!trig||e.target!==trig) stopPlayback(false);
      return;
    }
    if(state.ready){
      const trig=state.ready.trigger;
      if(!trig||e.target!==trig){state.ready=null;updatePlayingUI();}
    }
  }
  /* 点按页面其他位置（不是正在播放/就绪的那个按钮）也立即停止，避免用户以为静音了其实还在响 */
  function onDocClickAudio(e){
    if(state.playing){
      const trig=state.playing.trigger;
      if(!trig||e.target!==trig) stopPlayback(false);
      return;
    }
    if(state.ready){
      const trig=state.ready.trigger;
      if(!trig||e.target!==trig){state.ready=null;updatePlayingUI();}
    }
  }
  function onVisibilityChange(){
    if(document.hidden){
      if(state.playing) stopPlayback(false);
      if(state.ready){state.ready=null;updatePlayingUI();}
    }
  }
  function onPageHide(){
    if(state.playing) stopPlayback(false);
  }

  /* ---------- 手动查询 ---------- */
  function onSearch(e){
    e.preventDefault();
    const q=(els.searchInput.value||'').trim();
    if(!q){
      state.query='';
      if(state.ref&&state.ref.source==='search'){state.ref=null;els.coords.textContent='';}
      renderList();updateStatus();
      announce('已清空筛选，显示全部路标');
      return;
    }
    const hits=state.marks.filter(function(m){return m.place.indexOf(q)>-1;});
    if(!hits.length){
      state.query='';
      if(state.ref&&state.ref.source==='search'){state.ref=null;els.coords.textContent='';}
      renderList();updateStatus();
      announce('没有找到包含「'+q+'」的路标，已显示全部路标');
      return;
    }
    state.query=q;
    state.ref={lat:hits[0].lat,lng:hits[0].lng,label:hits[0].place,source:'search'};
    els.coords.textContent='参考点：'+hits[0].place+' ｜ 按直线距离由近到远排列';
    renderList();updateStatus();
    announce('已按「'+q+'」筛选，共 '+visibleMarks().length+' 条路标');
  }

  /* ---------- 事件绑定 ---------- */
  function bindEvents(){
    on(els.contrastBtn,'click',function(){
      applyTheme(state.theme==='high'?'regular':'high',true);
    });
    on(els.audioModeBtn,'click',function(){openAudioModeModal(null);});
    on(els.audioSR,'click',function(){chooseAudioMode('sr');});
    on(els.audioSpeaker,'click',function(){chooseAudioMode('speaker');});
    on(els.audioCancel,'click',function(){closeAudioModeModal(true);});
    on(els.modeConfirmYes,'click',confirmAudioMode);
    on(els.modeConfirmNo,'click',cancelAudioModeConfirm);
    on(els.identityBtn,'click',toggleIdentity);
    on(els.searchForm,'submit',onSearch);
    on(els.showAllBtn,'click',function(){
      state.query='';
      els.searchInput.value='';
      if(state.ref&&state.ref.source==='search'){state.ref=null;}
      els.coords.textContent='';
      renderList();updateStatus();
      announce('已显示全部路标');
    });
    on(els.backTop,'click',closeDetail);
    on(els.backBottom,'click',closeDetail);
    on(els.detailListen,'click',function(){
      if(state.selectedId) toggleListen(state.selectedId,els.detailListen);
    });
    on(els.detailInaccurate,'click',function(){
      if(state.selectedId) openConfirm(state.selectedId,els.detailInaccurate,'inaccurate');
    });
    on(els.detailAccurate,'click',function(){
      if(state.selectedId) openConfirm(state.selectedId,els.detailAccurate,'accurate');
    });
    on(els.modalConfirm,'click',onConfirmClick);
    on(els.modalCancel,'click',closeConfirm);
    on(els.zoomIn,'click',function(){
      setScale(state.viewerScale+0.5);
      announce('已放大到 '+fmtScale(state.viewerScale)+' 倍');
    });
    on(els.zoomOut,'click',function(){
      setScale(state.viewerScale-0.5);
      announce('已缩小到 '+fmtScale(state.viewerScale)+' 倍');
    });
    on(els.zoomClose,'click',closeViewer);
    on(els.viewerStage,'touchstart',onTouchStart,{passive:true});
    on(els.viewerStage,'touchmove',onTouchMove,{passive:false});
    on(els.viewerStage,'touchend',onTouchEnd,{passive:true});
    on(els.viewerStage,'touchcancel',onTouchEnd,{passive:true});
    on(document,'keydown',onKeydown);
    on(document,'click',onDocClick,true);
    on(document,'click',onDocClickAudio,true);
    on(document,'focusin',onFocusIn);
    on(document,'visibilitychange',onVisibilityChange);
    on(window,'pagehide',onPageHide);
  }

  /* ---------- 生命周期 ---------- */
  async function init(){
    if(state.initialized) return;
    state.initialized=true;
    state.destroyed=false;
    state.detailOpen=false;
    state.selectedId=null;
    state.query='';
    state.locateFailed=false;
    state.ref=null;
    state.ready=null;
    state.playing=null;
    state.pendingMode=null;
    if(state.accurate) state.accurate.clear();
    state.audioMode=loadAudioMode();

    cacheEls();
    applyStaticCopy();
    applyTheme(loadTheme(),false);
    bindEvents();
    renderIdentity();

    // 服务器模式预留：API.base 非 'local' 时改走 fetch（TODO：接入后端后替换数据层实现）
    BambooDB.API.setBase(CONFIG.apiBase);

    els.status.textContent='正在加载路标…';
    try{
      state.marks=await BambooDB.listMarks({state:'published'});
    }catch(e){
      state.marks=[];
    }
    renderList();
    updateStatus();
    locate();
  }

  function destroy(){
    state.destroyed=true;
    state.initialized=false;
    if(announceTimer){clearTimeout(announceTimer);announceTimer=null;}
    if(geoGuard){clearTimeout(geoGuard);geoGuard=null;}
    stopPlayback(false);
    state.ready=null;
    try{window.speechSynthesis.cancel();}catch(e){}
    listeners.splice(0).forEach(function(item){
      try{item[0].removeEventListener(item[1],item[2],item[3]);}catch(e){}
    });
    revokeReg(cardReg);
    revokeReg(detailReg);
    if(els.modal) els.modal.hidden=true;
    if(els.audioModal) els.audioModal.hidden=true;
    if(els.modeConfirm) els.modeConfirm.hidden=true;
    if(els.viewer) els.viewer.hidden=true;
    if(els.viewerStage) els.viewerStage.textContent='';
    document.body.classList.remove('lowvis-locked');
    state.playing=null;
    state.ready=null;
    state.audioModePrompt=null;
    state.pendingMode=null;
    if(state.accurate) state.accurate.clear();
    state.selectedId=null;
    state.detailOpen=false;
  }

  window.BambooLowvis={init:init,destroy:destroy};

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){init();});
  }else{
    init();
  }
})();
</script>
