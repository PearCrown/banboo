<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EFE6">
<meta name="description" content="帮步 Bamboo · 竹小节：志愿者采集声音路标的 H5 原型">
<title>帮步 Bamboo · 竹小节</title>
<style>
/* ============================================================
   1. 品牌与字体变量（四端公共契约 4.7，方案A：系统字体，零外部加载）
   注意：四端合并时这一段只保留一份，页面内不得重定义这些变量。
   ============================================================ */
:root{
  --bb-bg:#F3EFE6; --bb-card:#FFFDF7; --bb-ink:#22332C; --bb-muted:#5C6B63;
  --bb-green:#2E6B4F; --bb-green2:#3F8A63; --bb-gold:#C9A227;
  --bb-line:#DDE5DE; --bb-warn:#C9A227; --bb-danger:#C05B4D;
  --bb-radius:18px;
  /* 志愿者/审核端口字体：标题衬线、正文无衬线 */
  --font-title:"Noto Serif CJK SC","Source Han Serif SC","STSong","SimSun",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  /* 字号（正常档） */
  --fs-title:24px; --fs-subtitle:20px; --fs-body:16px; --fs-small:14px;
  --btn-h:48px;
  /* 放大模式档（切换 html 标签 class="bb-large" 生效） */
  /* .bb-large 下：--fs-title:30px;--fs-subtitle:26px;--fs-body:22px;
     --fs-small:18px; --btn-h:64px */
}
html.bb-large{
  --fs-title:30px; --fs-subtitle:26px; --fs-body:22px; --fs-small:18px;
  --btn-h:64px;
}

/* ============================================================
   2. 基础重置
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bb-bg); color:var(--bb-ink);
  font-family:var(--font-body); font-size:var(--fs-body); line-height:1.65;
}
[hidden]{display:none !important}
button,input,textarea,select{font-family:inherit}
img{max-width:100%;height:auto}
p{margin:0}
.vol-sr{
  position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

/* 页面唯一根容器（公共契约 4.6） */
#view-vol{
  max-width:720px;margin:0 auto;height:100vh;height:100dvh;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:var(--bb-bg);
}
@media (min-width:760px){
  #view-vol{box-shadow:0 0 0 1px var(--bb-line)}
}

/* ============================================================
   3. 顶栏
   ============================================================ */
.vol-topbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px 10px;
  flex-wrap:wrap;padding:10px 16px;background:var(--bb-bg);
  border-bottom:1px solid var(--bb-line);position:relative;z-index:30;
}
.vol-brand{display:flex;align-items:center;gap:10px;min-width:0}
.vol-brand-mark{
  width:36px;height:36px;border-radius:12px;background:var(--bb-green);
  color:var(--bb-card);display:grid;place-items:center;flex:none;
  font-family:var(--font-title);font-size:21px;line-height:1;
}
.vol-brand-text{min-width:0}
.vol-brand-title{
  margin:0;font-family:var(--font-title);font-size:var(--fs-subtitle);
  font-weight:700;line-height:1.25;letter-spacing:.02em;white-space:nowrap;
}
.vol-brand-dot{color:var(--bb-gold)}
.vol-brand-sub{
  margin:0;font-size:var(--fs-small);color:var(--bb-muted);
  line-height:1.3;white-space:nowrap;
}
.vol-top-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.vol-menuwrap{position:relative}

/* ============================================================
   4. 按钮（全部为原生 button / a）
   ============================================================ */
.vol-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--btn-h);padding:0 18px;border-radius:14px;
  border:1.5px solid var(--bb-line);background:var(--bb-card);color:var(--bb-ink);
  font-family:var(--font-body);font-size:var(--fs-body);font-weight:700;
  line-height:1.2;text-align:center;text-decoration:none;cursor:pointer;
  -webkit-appearance:none;appearance:none;
  transition:background-color .15s ease,border-color .15s ease;
}
.vol-btn:hover{border-color:var(--bb-green2)}
.vol-btn:focus-visible{outline:3px solid var(--bb-gold);outline-offset:2px}
.vol-btn:disabled{opacity:.55;cursor:not-allowed}
.vol-btn-primary{background:var(--bb-green);border-color:var(--bb-green);color:var(--bb-card)}
.vol-btn-primary:hover{background:var(--bb-green2);border-color:var(--bb-green2)}
.vol-btn-secondary{background:var(--bb-card);border-color:var(--bb-green);color:var(--bb-green)}
.vol-btn-secondary:hover{background:var(--bb-bg)}
.vol-btn-ghost{background:transparent;border-color:transparent;color:var(--bb-green);min-height:var(--btn-h);padding:0 12px}
.vol-btn-ghost:hover{background:transparent;border-color:var(--bb-line)}
.vol-btn-danger{background:var(--bb-danger);border-color:var(--bb-danger);color:var(--bb-card)}
.vol-btn-sm{min-height:calc(var(--btn-h) - 4px);font-size:var(--fs-small);padding:0 14px;border-radius:12px}
.vol-btn-block{width:100%}

/* ============================================================
   5. 主体与卡片
   ============================================================ */
.vol-main{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
.vol-panel{display:block}
.vol-panel > * + *{margin-top:14px}
.vol-card{
  background:var(--bb-card);border:1px solid var(--bb-line);
  border-radius:var(--bb-radius);padding:18px;
}
.vol-h2{
  margin:0 0 6px;font-family:var(--font-title);font-size:var(--fs-title);
  font-weight:700;line-height:1.3;letter-spacing:.01em;overflow-wrap:anywhere;
}
.vol-h2:focus{outline:none}
.vol-h3{
  margin:0 0 8px;font-family:var(--font-title);font-size:var(--fs-subtitle);
  font-weight:700;line-height:1.35;
}
.vol-lead{margin:6px 0 0;color:var(--bb-muted)}
.vol-help{margin:8px 0 0;color:var(--bb-muted);font-size:var(--fs-small)}
.vol-eyebrow{
  margin:0 0 8px;font-size:var(--fs-small);font-weight:700;
  letter-spacing:.12em;color:var(--bb-green);
}
.vol-note{margin:8px 0 0;font-size:var(--fs-small);color:var(--bb-muted)}
.vol-ok{margin:10px 0 0;font-weight:700;color:var(--bb-green);font-size:var(--fs-small)}
.vol-warn{margin:8px 0 0;font-weight:700;color:var(--bb-ink);font-size:var(--fs-small)}
.vol-warn::before{content:"⚠ ";color:var(--bb-warn)}
.vol-stack{display:grid;gap:10px;margin-top:16px}
.vol-tips{margin:8px 0 0;padding-left:1.2em;color:var(--bb-muted);font-size:var(--fs-small)}
.vol-tips li + li{margin-top:6px}

/* ============================================================
   5b. 竹子与竹叶装饰（纯内联 SVG，零外部依赖，全部 aria-hidden）
   ============================================================ */
.vol-hero{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--bb-card) 0%,#F4F9F1 100%);
}
.vol-hero-inner{position:relative;z-index:1}
.vol-hero-top{display:flex;align-items:center;gap:12px}
.vol-hero-copy{flex:1;min-width:0}
.vol-hero-mascot{flex:none;width:128px;margin:0 -4px -2px 0}
.vol-mascot{display:block;width:100%;height:auto}
.vol-leaf{
  display:inline-block;width:1.05em;height:1.05em;vertical-align:-.14em;
  margin-right:.4em;color:var(--bb-green);flex:none;
}
.vol-bamboo-divider{display:flex;align-items:center;gap:10px;color:var(--bb-green2)}
.vol-bamboo-line{
  flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--bb-line) 30%,var(--bb-line) 70%,transparent);
}
.vol-bamboo-divider svg{flex:none;width:84px;height:32px}
.vol-grove{
  position:absolute;inset:0;z-index:0;overflow:hidden;
  pointer-events:none;
}
.vol-grove svg{display:block;width:100%;height:100%;color:var(--bb-green);opacity:.26}
.vol-card-sprig{position:relative;overflow:hidden}
.vol-card-body{position:relative;z-index:1}
.vol-bamboo-sprig{
  position:absolute;z-index:0;top:-4px;right:2px;
  width:116px;height:auto;color:var(--bb-green);opacity:.18;pointer-events:none;
}
@media (max-width:520px){
  .vol-hero-top{flex-wrap:wrap;gap:6px}
  .vol-hero-mascot{width:104px;margin:8px auto 0}
}

/* ============================================================
   6. 步骤条 / 向导
   ============================================================ */
.vol-wizard-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.vol-steps{display:flex;gap:4px;flex:1;min-width:60px}
.vol-steps i{display:block;height:6px;flex:1;border-radius:3px;background:var(--bb-line)}
.vol-steps i.vol-on{background:var(--bb-green)}
.vol-step-count{
  margin:0;font-size:var(--fs-small);color:var(--bb-muted);
  font-weight:700;white-space:nowrap;
}
.vol-wizard-foot{display:flex;gap:10px;margin-top:16px}
.vol-wizard-foot .vol-btn{flex:1 1 0;min-width:0;padding:0 12px}
.vol-skip{text-align:center;margin-top:4px}
.vol-skip .vol-btn{width:100%}

/* ============================================================
   7. 表单
   ============================================================ */
.vol-field{display:block;margin-top:14px}
.vol-label{
  display:block;margin-bottom:6px;font-size:var(--fs-small);
  font-weight:700;color:var(--bb-muted);letter-spacing:.02em;
}
.vol-input,.vol-textarea,.vol-select{
  width:100%;min-height:var(--btn-h);padding:12px 14px;
  border:1.5px solid var(--bb-line);border-radius:12px;
  background:#FFFFFF;color:var(--bb-ink);font-size:var(--fs-body);
  line-height:1.5;
}
.vol-textarea{min-height:132px;resize:vertical;line-height:1.65}
.vol-input:focus-visible,.vol-textarea:focus-visible,.vol-select:focus-visible{
  outline:3px solid var(--bb-gold);outline-offset:1px;border-color:var(--bb-green);
}
.vol-input[aria-invalid="true"],.vol-textarea[aria-invalid="true"],.vol-select[aria-invalid="true"]{
  border-color:var(--bb-danger);border-width:2px;
}
.vol-file{
  display:block;width:100%;padding:12px;border:1.5px dashed var(--bb-line);
  border-radius:14px;background:var(--bb-card);color:var(--bb-ink);
  font-size:var(--fs-small);
}
.vol-file::file-selector-button{
  margin-right:12px;padding:8px 14px;min-height:calc(var(--btn-h) - 8px);
  border:1.5px solid var(--bb-green);border-radius:10px;
  background:var(--bb-card);color:var(--bb-green);
  font-family:inherit;font-size:var(--fs-small);font-weight:700;cursor:pointer;
}
.vol-file:focus-visible{outline:3px solid var(--bb-gold);outline-offset:2px}

/* ============================================================
   8. 位置 / 提示词 / 录音
   ============================================================ */
.vol-geo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.vol-geo-text{
  flex:1 1 100%;margin:0;padding:10px 12px;border-radius:12px;
  background:var(--bb-bg);border:1px solid var(--bb-line);
  font-size:var(--fs-small);font-weight:700;
}
.vol-prompt{
  margin-top:14px;padding:14px;border:1px solid var(--bb-line);
  border-radius:14px;background:var(--bb-bg);
}
.vol-prompt-label{
  margin:0;font-size:var(--fs-small);font-weight:700;color:var(--bb-muted);
  letter-spacing:.06em;
}
.vol-prompt-text{
  margin:8px 0 12px;font-family:var(--font-title);
  font-size:var(--fs-subtitle);line-height:1.65;
}
.vol-rec{margin-top:14px;padding:16px 14px 14px;border:1px solid var(--bb-line);border-radius:14px}
.vol-rec-live{margin:0 0 4px;font-weight:700;font-size:var(--fs-small)}
.vol-rec-dot{color:var(--bb-danger);letter-spacing:0}
.vol-timer{
  margin:6px 0 14px;font-size:calc(var(--fs-title) * 1.1);
  font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;
  text-align:center;
}
.vol-rec-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vol-audio{width:100%;margin-top:10px}
.vol-note-box{
  margin-top:14px;padding:14px;border-radius:12px;
  background:var(--bb-bg);border:1px solid var(--bb-line);border-left-width:4px;
}
.vol-note-warn{border-left-color:var(--bb-warn);background:#FBF6E6}
.vol-note-danger{border-left-color:var(--bb-danger);background:#FBEEEC}
.vol-note-ok{border-left-color:var(--bb-green);background:var(--bb-card)}
.vol-note-box p{margin:6px 0 0}
.vol-note-box .vol-h3{margin-bottom:4px}

/* ============================================================
   9. 盲道状态大卡片（单选）
   ============================================================ */
.vol-choices{margin-top:14px}
.vol-choice{
  display:flex;align-items:center;gap:14px;width:100%;
  margin-top:10px;padding:13px 15px;text-align:left;
  border:2px solid var(--bb-line);border-radius:16px;
  background:var(--bb-card);color:var(--bb-ink);
  font-family:inherit;font-size:var(--fs-body);line-height:1.4;cursor:pointer;
}
.vol-choice:hover{border-color:var(--bb-green2)}
.vol-choice:focus-visible{outline:3px solid var(--bb-gold);outline-offset:2px}
.vol-choice[aria-checked="true"]{
  border-width:3px;border-color:var(--bb-green);padding:12px 14px;
  background:var(--bb-bg);
  background:color-mix(in srgb, var(--bb-green) 9%, var(--bb-card));
}
.vol-choice-ico{
  flex:none;width:40px;height:40px;border-radius:12px;display:grid;
  place-items:center;background:var(--bb-bg);font-size:20px;font-weight:700;
}
.vol-choice[aria-checked="true"] .vol-choice-ico{
  background:var(--bb-green);color:var(--bb-card);
}
.vol-choice-body{flex:1;min-width:0}
.vol-choice-name{display:block;font-weight:700}
.vol-choice-desc{display:block;font-size:var(--fs-small);color:var(--bb-muted)}
.vol-choice-check{
  display:none;flex:none;font-size:var(--fs-small);font-weight:700;color:var(--bb-green);
}
.vol-choice[aria-checked="true"] .vol-choice-check{display:inline-block}
.vol-selected{margin:12px 0 0;font-size:var(--fs-small);font-weight:700;color:var(--bb-green)}

/* ============================================================
   10. 照片
   ============================================================ */
.vol-photo{margin-top:12px}
.vol-photo-img{
  display:block;width:100%;max-height:340px;object-fit:cover;
  border-radius:14px;border:1px solid var(--bb-line);
}
.vol-photo-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ============================================================
   11. 预览 / 结果 / 列表
   ============================================================ */
.vol-review{display:grid;gap:10px;margin-top:14px}
.vol-row{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  border:1px solid var(--bb-line);border-radius:14px;background:var(--bb-card);
}
.vol-row-main{flex:1;min-width:0}
.vol-row-label{display:block;font-size:var(--fs-small);color:var(--bb-muted)}
.vol-row-value{display:block;font-weight:700;overflow-wrap:anywhere}
.vol-row .vol-btn{flex:none}
.vol-thumb{
  width:72px;height:72px;object-fit:cover;border-radius:10px;
  border:1px solid var(--bb-line);flex:none;
}
.vol-kv{margin:14px 0 0;display:grid;gap:8px}
.vol-kv > div{
  display:flex;gap:12px;justify-content:space-between;
  padding-bottom:8px;border-bottom:1px dashed var(--bb-line);
}
.vol-kv dt{flex:none;color:var(--bb-muted);font-size:var(--fs-small)}
.vol-kv dd{margin:0;min-width:0;font-weight:700;text-align:right;overflow-wrap:anywhere}
.vol-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.vol-stat{background:var(--bb-bg);border-radius:12px;padding:10px;text-align:center}
.vol-stat-num{
  display:block;font-family:var(--font-title);font-size:var(--fs-subtitle);
  font-weight:700;line-height:1.3;
}
.vol-stat-label{display:block;font-size:var(--fs-small);color:var(--bb-muted)}
.vol-anon{margin:0;font-family:var(--font-title);font-size:var(--fs-title);font-weight:700;overflow-wrap:anywhere}
.vol-sublist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.vol-sub{background:var(--bb-bg);border:1px solid var(--bb-line);border-radius:14px;padding:14px}
.vol-sub-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vol-sub-title{
  margin:0;font-family:var(--font-title);font-size:var(--fs-body);
  font-weight:700;overflow-wrap:anywhere;
}
.vol-meta{margin:6px 0 0;font-size:var(--fs-small);color:var(--bb-muted);overflow-wrap:anywhere}
.vol-chip{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  padding:3px 10px;border:1.5px solid var(--bb-line);border-radius:999px;
  background:var(--bb-card);color:var(--bb-ink);
  font-size:var(--fs-small);font-weight:700;line-height:1.4;
}
.vol-chip-published{border-color:var(--bb-green)}
.vol-chip-queue{border-color:var(--bb-gold)}
.vol-chip-returned{border-color:#C07A2C}
.vol-chip-rejected{border-color:var(--bb-danger)}
.vol-chip-hidden{border-color:var(--bb-muted)}
.vol-reviewnote{
  margin-top:10px;padding:10px 12px;border-left:3px solid var(--bb-warn);
  border-radius:0 10px 10px 0;background:var(--bb-card);
}
.vol-reviewnote-title{margin:0 0 6px;font-size:var(--fs-small);font-weight:700}
.vol-reviewnote-text{margin:0;font-size:var(--fs-small);overflow-wrap:anywhere}
.vol-tags{margin:0 0 6px}
.vol-tag{
  display:inline-block;margin:0 6px 6px 0;padding:2px 8px;
  border:1px solid var(--bb-line);border-radius:8px;
  background:var(--bb-bg);font-size:var(--fs-small);
}
.vol-empty{padding:18px;text-align:left}
.vol-empty-head{display:flex;align-items:center;gap:10px}
.vol-empty-mascot{flex:none;width:96px}
.vol-empty-title{margin:0;font-family:var(--font-title);font-size:var(--fs-subtitle);font-weight:700}
.vol-section-title{margin:18px 0 10px}
.vol-pc-text{
  margin:8px 0 0;padding:10px 12px;border-radius:10px;
  background:var(--bb-card);border:1px solid var(--bb-line);
  font-size:var(--fs-small);overflow-wrap:anywhere;
}

/* ============================================================
   11b. 徽章与竹子成长
   ============================================================ */
.vol-badge-block{margin-top:14px}
.vol-subhead{
  margin:0 0 8px;font-family:var(--font-title);
  font-size:var(--fs-body);font-weight:700;line-height:1.35;
}
.vol-badge-list{
  list-style:none;margin:10px 0 0;padding:0;
  display:flex;flex-direction:column;gap:10px;
}
.vol-badge-row{
  display:flex;align-items:center;gap:12px;padding:10px;
  border:1.5px solid var(--bb-line);border-radius:16px;
  background:var(--bb-bg);min-width:0;
}
.vol-badge-row.is-on{border-color:var(--bb-green)}
.vol-badge-pic{
  flex:none;display:block;width:96px;height:auto;max-height:196px;
  object-fit:contain;
}
.vol-badge-row.is-off .vol-badge-pic{filter:grayscale(1);opacity:.55}
.vol-badge-svg{flex:none;display:block;width:56px;height:56px}
.vol-badge-info{min-width:0;display:flex;flex-direction:column;gap:1px}
.vol-badge-name{font-size:var(--fs-body);font-weight:700;line-height:1.35}
.vol-badge-title{font-size:var(--fs-body);font-weight:700;color:var(--bb-green);line-height:1.35}
.vol-badge-row.is-off .vol-badge-title{color:var(--bb-muted)}
.vol-badge-need{font-size:var(--fs-small);color:var(--bb-muted);line-height:1.4}
.vol-badge-state{font-size:var(--fs-small);font-weight:700;line-height:1.4;margin-top:2px}
.vol-badge-row.is-on .vol-badge-state{color:var(--bb-green)}
.vol-badge-row.is-off .vol-badge-state{color:var(--bb-muted)}
.vol-badge-gap{font-size:var(--fs-small);color:var(--bb-muted);line-height:1.4}
@media (max-width:360px){
  .vol-badge-pic{width:82px}
  .vol-badge-row{gap:10px;padding:9px}
}

.vol-growth{
  margin-top:14px;padding:14px;border:1px solid var(--bb-line);
  border-radius:16px;background:linear-gradient(160deg,#F9FCF5,#EDF5E6);
}
.vol-growth-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.vol-growth-head .vol-subhead{margin:0}
.vol-growth-rule{font-size:var(--fs-small);color:var(--bb-muted)}
.vol-growth-scene{position:relative;height:230px;margin-top:8px}
.vol-growth-svg{
  position:absolute;left:0;bottom:0;width:62%;height:100%;display:block;
}
.vol-growth-text{margin:0;font-size:var(--fs-small);color:var(--bb-muted)}
.vol-growth-text strong{color:var(--bb-ink);font-size:var(--fs-body)}
.vol-growth-foot{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap;margin-top:8px;
}
.vol-growth-foot .vol-btn{flex:none}
.vol-ip{
  position:absolute;right:6px;bottom:4px;width:136px;margin:0;
  pointer-events:none;
}
.vol-ip-img{
  display:block;width:100%;height:auto;
  filter:drop-shadow(0 8px 12px rgba(34,51,44,.18));
}
.vol-ip-tag{
  position:absolute;right:0;bottom:0;padding:3px 8px;border-radius:12px 0 0 0;
  background:#FFFDF7;color:var(--bb-green);
  font-size:var(--fs-small);font-weight:700;line-height:1.5;
  box-shadow:0 1px 4px rgba(34,51,44,.15);
}
@media (max-width:380px){
  .vol-ip{width:122px}
}
@media (max-width:340px){
  .vol-growth-svg{width:58%}
  .vol-ip{width:108px}
}

/* ============================================================
   12. 底部导航
   ============================================================ */
.vol-tabbar{
  position:relative;z-index:2;
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  border-top:1px solid var(--bb-line);background:var(--bb-card);
}
.vol-tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:calc(var(--btn-h) + 8px);padding:4px;border:0;border-radius:12px;
  background:transparent;color:var(--bb-muted);
  font-family:var(--font-body);font-size:var(--fs-small);font-weight:700;cursor:pointer;
}
.vol-tab:focus-visible{outline:3px solid var(--bb-gold);outline-offset:-2px}
.vol-tab[aria-current="page"]{color:var(--bb-green);background:var(--bb-bg)}
.vol-tab-ico{font-size:20px;line-height:1}

/* ============================================================
   13. 身份切换菜单
   ============================================================ */
.vol-menu{
  position:absolute;top:calc(100% + 6px);right:0;z-index:40;
  min-width:220px;padding:6px;
  background:var(--bb-card);border:1px solid var(--bb-line);
  border-radius:14px;box-shadow:0 10px 30px rgba(34,51,44,.14);
}
.vol-menu a{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px;border-radius:10px;color:var(--bb-ink);
  font-size:var(--fs-small);font-weight:700;text-decoration:none;
}
.vol-menu a:hover{background:var(--bb-bg)}
.vol-menu a:focus-visible{outline:3px solid var(--bb-gold);outline-offset:-2px}
.vol-menu a.vol-menu-current{color:var(--bb-green)}
.vol-menu-tag{font-weight:400;color:var(--bb-muted)}

/* ============================================================
   14. 弹窗（不用 alert/confirm，自制浮层）
   ============================================================ */
.vol-dialog-layer{
  position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(34,51,44,.46);
}
.vol-dialog{
  width:100%;max-width:440px;padding:22px;
  background:var(--bb-card);border-radius:var(--bb-radius);
  box-shadow:0 18px 50px rgba(34,51,44,.28);
}
.vol-dialog:focus{outline:none}
.vol-dialog-desc{margin:8px 0 0;color:var(--bb-muted)}
.vol-dialog-actions{display:flex;gap:10px;margin-top:20px}
.vol-dialog-actions .vol-btn{flex:1 1 0;min-width:0;padding:0 12px}

/* ============================================================
   15. 轻提示
   ============================================================ */
.vol-toast{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:80;
  max-width:min(560px,calc(100vw - 32px));
  padding:10px 16px;border-radius:12px;
  background:var(--bb-ink);color:var(--bb-card);
  font-size:var(--fs-small);font-weight:600;text-align:center;
  box-shadow:0 8px 24px rgba(34,51,44,.2);
}
html.bb-large .vol-toast{bottom:calc(102px + env(safe-area-inset-bottom,0px))}

/* ============================================================
   16. 减少动态
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

/* ============================================================
   录音器（真实 MediaRecorder；权限被拒降级为文字）
   ============================================================ */
function pickMime(){
  if(!window.MediaRecorder) return '';
  const list=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  for(let i=0;i<list.length;i++){
    try{
      if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(list[i])) return list[i];
    }catch(e){}
  }
  return '';
}
function mediaErrorText(e){
  const n=(e&&e.name)||'';
  if(n==='NotAllowedError'||n==='SecurityError') return '麦克风权限被拒绝';
  if(n==='NotFoundError'||n==='DevicesNotFoundError') return '没有找到麦克风';
  if(n==='NotReadableError'||n==='TrackStartError') return '麦克风被占用或不可读';
  if(n==='OverconstrainedError') return '麦克风参数不支持';
  return '录音启动失败（'+(n||'未知错误')+')';
}

function createRecorder(key,max,onChange){
  const R={
    key:key, max:max, onChange:onChange,
    mode:'audio', state:'idle',
    blob:null, url:null, secs:0, text:'', note:'',
    deny:0, err:'', unsupported:false,
    gen:0, finishedGen:0, stream:null, mr:null, chunks:[], startedAt:0, tick:null,
    requesting:false
  };

  R.release=function(){
    if(R.stream){
      try{ R.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
      R.stream=null;
    }
  };
  R.paint=function(){
    const el=$('[data-timer="'+R.key+'"]');
    if(el) el.textContent=fmtClock(R.secs)+' / '+fmtClock(R.max);
  };

  R.start=async function(){
    if(R.state==='recording'||R.state==='starting'||R.requesting) return;
    R.err='';
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)||!window.MediaRecorder){
      R.unsupported=true; R.mode='text'; R.state='text';
      R.note='当前浏览器不支持录音，已切换为文字描述。';
      R.onChange(); return;
    }
    R.requesting=true;
    R.gen++;
    const gen=R.gen;
    let stream=null;
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
      R.requesting=false;
      if(gen!==R.gen) return;
      R.deny++;
      R.err=mediaErrorText(e);
      if(R.deny>=2){
        R.mode='text'; R.state='text';
        R.note='麦克风连续两次无法使用，已切换为文字描述。';
      }else{
        R.state='denied';
      }
      R.onChange();
      return;
    }
    R.requesting=false;
    if(gen!==R.gen){
      try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){}
      return;
    }
    R.stream=stream;
    R.chunks=[];
    let mr=null;
    try{
      const mime=pickMime();
      mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    }catch(e){
      try{ mr=new MediaRecorder(stream); }
      catch(e2){
        try{ stream.getTracks().forEach(t=>t.stop()); }catch(e3){}
        R.stream=null; R.deny++;
        R.err='录音组件初始化失败';
        R.mode='text'; R.state='text';
        R.note='这台设备无法录音，已切换为文字描述。';
        R.onChange(); return;
      }
    }
    R.mr=mr;
    const finish=function(){
      if(gen!==R.gen || R.finishedGen===gen) return;
      R.finishedGen=gen;
      const type=(mr&&mr.mimeType)||'audio/webm';
      const blob=new Blob(R.chunks,{type:type});
      R.release();
      if(!blob.size){ R.state='idle'; R.onChange(); return; }
      if(R.url){ try{ URL.revokeObjectURL(R.url); }catch(e){} }
      R.blob=blob;
      R.url=URL.createObjectURL(blob);
      R.state='ready';
      R.onChange();
      // 录完把焦点放回「重录」，键盘用户不必从页首重新 Tab
      if(R.key==='mark' && S.tab==='collect' && S.collect.screen==='wizard' && S.collect.step===2) focusEl('[data-act="rec-redo"]');
      if(R.key==='pc' && S.tab==='postcard') focusEl('[data-act="pc-rec-redo"]');
    };
    mr.ondataavailable=function(e){ if(e.data&&e.data.size) R.chunks.push(e.data); };
    mr.onstop=finish;
    mr.onerror=function(){
      if(gen!==R.gen) return;
      R.release(); R.deny++;
      R.err='录音过程中出错';
      if(R.deny>=2){
        R.mode='text'; R.state='text';
        R.note='录音出错，已切换为文字描述。';
      }else{
        R.state='denied';
      }
      R.onChange();
    };
    try{
      mr.start(250);
    }catch(e){
      R.release(); R.deny++;
      R.err='无法开始录音';
      R.mode='text'; R.state='text';
      R.note='无法开始录音，已切换为文字描述。';
      R.onChange(); return;
    }
    R.startedAt=Date.now();
    R.secs=0;
    R.state='recording';
    R.tick=setInterval(function(){
      if(R.state!=='recording') return;
      R.secs=Math.min(R.max,(Date.now()-R.startedAt)/1000);
      R.paint();
      if(R.secs>=R.max) R.stop(true);
    },200);
    R.onChange();
  };

  R.stop=function(auto){
    if(R.tick){ clearInterval(R.tick); R.tick=null; }
    if(R.requesting){
      // 权限请求还没返回时离开：作废这次启动，避免在后台开启录音
      R.gen++; R.requesting=false; R.release(); return;
    }
    if(R.state!=='recording'){ R.release(); return; }
    R.secs=Math.min(R.max,(Date.now()-R.startedAt)/1000);
    R.state='stopping';
    const gen=R.gen;
    try{ if(R.mr&&R.mr.state!=='inactive') R.mr.stop(); }catch(e){}
    R.release();
    // 个别浏览器 onstop 不触发时的兜底：手动收尾（幂等）
    setTimeout(function(){
      if(gen===R.gen && R.state==='stopping' && R.mr && typeof R.mr.onstop==='function'){
        try{ R.mr.onstop(); }catch(e){}
      }
    },1600);
    if(auto) toast('已到录音时长上限，自动停止');
    R.onChange();
  };

  R.discard=function(){
    R.gen++;
    R.requesting=false;
    if(R.tick){ clearInterval(R.tick); R.tick=null; }
    try{ if(R.mr&&R.mr.state!=='inactive') R.mr.stop(); }catch(e){}
    R.release();
    R.mr=null; R.chunks=[];
    if(R.url){ try{ URL.revokeObjectURL(R.url); }catch(e){} R.url=null; }
    R.blob=null; R.secs=0; R.state='idle'; R.note=''; R.err='';
  };

  R.reset=function(){
    R.discard();
    R.mode='audio'; R.text=''; R.deny=0; R.unsupported=false;
  };

  R.loadBlob=function(blob,secs){
    R.gen++;
    R.requesting=false;
    if(R.url){ try{ URL.revokeObjectURL(R.url); }catch(e){} }
    R.blob=blob;
    R.secs=Number(secs)||0;
    R.url=URL.createObjectURL(blob);
    R.state='ready'; R.mode='audio'; R.note=''; R.err=''; R.deny=0;
  };

  R.destroy=function(){ R.reset(); R.release(); };
  return R;
}

function live(msg){
  const el=$('#volLive');
  if(!el) return;
  el.textContent='';
  if(liveTimer) clearTimeout(liveTimer);
  liveTimer=setTimeout(function(){ el.textContent=msg; },30);
}
function toast(msg){
  const el=$('#volToast');
  if(!el) return;
  el.textContent=msg;
  el.hidden=false;
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.hidden=true; },5200);
}
function formError(msg,el){
  live(msg);
  toast('⚠ '+msg);
  if(el){
    try{
      if(el.setAttribute) el.setAttribute('aria-invalid','true');
      el.focus();
    }catch(e){}
  }
}
function focusEl(sel){
  const el=$(sel);
  if(el&&typeof el.focus==='function'){ try{ el.focus(); }catch(e){} }
}
function focusTitle(panel){
  if(!panel) return;
  const h=panel.querySelector('[data-title]');
  if(h&&typeof h.focus==='function'){ try{ h.focus(); }catch(e){} }
}
function speak(text){
  if(!('speechSynthesis' in window) || typeof window.SpeechSynthesisUtterance!=='function'){
    toast('当前浏览器不支持朗读，请直接阅读屏幕文字');
    return;
  }
  try{
    window.speechSynthesis.cancel();
    const u=new window.SpeechSynthesisUtterance(String(text||''));
    u.lang='zh-CN';
    u.rate=0.95;
    window.speechSynthesis.speak(u);
  }catch(e){
    toast('朗读失败，请直接阅读屏幕文字');
  }
}

  S.dialog.onConfirm=opts.onConfirm||null;

    +'    <button type="button" class="vol-btn '+(opts.danger?'vol-btn-danger':'vol-btn-primary')+'" data-act="dialog-ok" aria-label="'+esc(opts.confirmText||'确定')+'">'+esc(opts.confirmText||'确定')+'</button>'

function closeDialog(confirmed){
  const layer=$('#volDialogLayer');
  if(!layer||layer.hidden) return;
  layer.hidden=true;
  layer.innerHTML='';
  const cb=S.dialog.onConfirm;
  S.dialog.onConfirm=null;
  const opener=S.dialog.opener;
  S.dialog.opener=null;
  if(opener && opener.isConnected){ try{ opener.focus(); }catch(e){} }
  if(confirmed && cb){ try{ cb(); }catch(e){ console.error(e); } }
}
function onDialogKey(e){
  const layer=$('#volDialogLayer');
  if(!layer||layer.hidden) return;
  if(e.key==='Escape'){ e.preventDefault(); closeDialog(false); return; }
  if(e.key!=='Tab') return;
  const items=$$('button,a[href],input,textarea,select',layer).filter(function(x){return !x.disabled;});
  if(!items.length) return;
  const first=items[0], last=items[items.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

function renderCollect(focus){
  const panel=$('#volPanelCollect');
  if(!panel) return;
  const c=S.collect;
  let html='';
  if(c.screen==='wizard') html=wizardTop(c.step)+stepBody(c.step)+stepFoot(c.step);
  else if(c.screen==='result') html=wizardTop(6,true)+resultHTML();
  else html=collectHomeHTML();
  panel.innerHTML=html;
  if(focus) focusTitle(panel);
  if(c.screen==='wizard' && c.step===2 && S.markRec) S.markRec.paint();
}

  +'  <div class="vol-steps" aria-hidden="true">'+segs+'</div>'

function blindChoiceHTML(selected){
  let first=true;
  return BLIND_OPTIONS.map(function(o){
    const on=o.v===selected;
    const tab=on?'0':(first&&!selected?'0':'-1');
    if(first&&!selected) first=false;
    const base=o.v+'：'+o.desc;
    return '<button type="button" class="vol-choice" role="radio" aria-checked="'+(on?'true':'false')+'" '
      +'data-choice="'+esc(o.v)+'" data-base-label="'+esc(base)+'" tabindex="'+tab+'" '
      +'aria-label="'+esc(base+(on?'，已选中':''))+'">'
      +'<span class="vol-choice-ico" aria-hidden="true">'+o.ico+'</span>'
      +'<span class="vol-choice-body"><span class="vol-choice-name">'+esc(o.v)+'</span><span class="vol-choice-desc">'+esc(o.desc)+'</span></span>'
      +'<span class="vol-choice-check" aria-hidden="true">✓ 已选中</span>'
      +'</button>';
  }).join('');
}

function geoText(){
  const c=S.collect;
  const d=c.draft||{};
  const place=(d.place&&d.place.trim())?d.place.trim():'请填写点位名称';
  if(c.geo==='pending') return '正在获取当前位置…';
  if(c.geo==='ok' && typeof d.lat==='number' && typeof d.lng==='number'){
    return '✓ 位置已确认：'+place+'（坐标 '+d.lat+', '+d.lng+'）';
  }
  if(c.geo==='fail'){
    return '⚠ 未获取到定位坐标'+(c.geoMsg?'（'+c.geoMsg+'）':'')+'。请手动填写点位名称，坐标将留空。';
  }
  return '定位尚未开始。点「重新定位」，或直接填写点位名称。';
}

  const el=$('#volGeoStatus');
  if(el) el.textContent=geoText();

function renderMine(focus){
  const panel=$('#volPanelMine');
  if(!panel) return;
  const p=getProfile();
  const total=Math.floor(p.zhuli/(CONFIG.zhuliPerNode||3));
  const groveMax=(CONFIG.stalkSegments||12)*(CONFIG.groveStalks||12);

  if(typeof S.groveView!=='number'||S.groveView<0||S.groveView>=count){

  panel.innerHTML=mineHTML(p,mine);

function groveArt(segs){
  const stalkMax=CONFIG.stalkSegments||12;
  const maxStalks=CONFIG.groveStalks||12;
  const baseY=218;
  const segH=12.5;
  const stalkW=7;
  const x0=14, step=11.8;
  const full=Math.floor(segs/stalkMax);
  const part=segs%stalkMax;
  let s='<ellipse cx="85" cy="222" rx="82" ry="9" fill="#DDEBCF"/>';
  s+='<g stroke="#7FAF66" stroke-width="1.2" fill="none" stroke-linecap="round">'
    +'<path d="M20 220C18 212 20 206 24 200"/><path d="M30 221C32 213 36 208 41 204"/>'
    +'<path d="M150 220C152 212 150 206 146 200"/></g>';
  if(segs===0){
    s+='<path d="M24 218C24 208 24 200 24 192" stroke="#5E8F4C" stroke-width="2" fill="none" stroke-linecap="round"/>';
    s+='<path d="M24 200C16 194 8 194 2 198C8 204 16 204 24 200Z" fill="#A9D18A"/>';
    s+='<path d="M24 196C32 190 40 190 46 194C40 200 32 200 24 196Z" fill="#BBDFA4"/>';
  }else{
    for(let i=0;i<maxStalks;i++){
      const n=i<full?stalkMax:(i===full?part:0);
      if(n<=0) continue;
      const x=x0+i*step;
      const top=baseY-n*segH;
      s+='<g class="vol-grove-stalk">';
      for(let j=0;j<n;j++){
        const y=baseY-(j+1)*segH;
        s+='<rect class="vol-grove-seg" x="'+(x-stalkW/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+stalkW+'" height="'+segH.toFixed(1)+'" rx="2.4" fill="#BBDFA4" stroke="#5E8F4C" stroke-width="1.1"/>';
        s+='<path d="M'+(x-stalkW/2-0.5).toFixed(1)+' '+(y+1).toFixed(1)+'H'+(x+stalkW/2+0.5).toFixed(1)+'" stroke="#7FAF66" stroke-width="0.9"/>';
      }
      s+='<g fill="#A9D18A" stroke="#5E8F4C" stroke-width="0.9" stroke-linejoin="round" transform="translate('+x.toFixed(1)+' '+top.toFixed(1)+') scale(.42)">'
        +'<g transform="rotate(-44)"><path d="M0 0C8-11 24-13 32-3C22 7 7 7 0 0Z"/></g>'
        +'<g transform="rotate(38)"><path d="M0 0C8-11 24-13 32-3C22 7 7 7 0 0Z"/></g>'
        +'<g transform="translate(0 -2) rotate(-90)"><path d="M0 0C6-9 18-11 26-3C18 5 6 5 0 0Z"/></g>'
        +'</g>';
      s+='</g>';
    }
  }
  return '<svg class="vol-growth-svg" viewBox="0 0 200 240" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false">'+s+'</svg>';
}
function growthHTML(p){
  const per=CONFIG.zhuliPerNode||3;
  const stalkMax=CONFIG.stalkSegments||12;
  const groveStalks=CONFIG.groveStalks||12;
  const groveMax=stalkMax*groveStalks;
  const total=Math.floor(p.zhuli/per);
  const count=Math.floor(total/groveMax)+1;
  const view=typeof S.groveView==='number'?S.groveView:0;
  const segs=Math.max(0,Math.min(groveMax,total-view*groveMax));
  const fullStalks=Math.floor(segs/stalkMax);
  const part=segs%stalkMax;
  const stalks=fullStalks+(part>0?1:0);
  const fullGrove=segs>=groveMax;
  const gap=(p.zhuli%per===0)?per:(per-(p.zhuli%per));
  const canSwitch=count>1;
  const state=segs===0
    ? '还没开始长'
    : (fullGrove
      ? '已长满 12 根 × 12 节'
      : '已长成 <strong>'+stalks+'</strong> 根 · 共 <strong>'+segs+'</strong> 节');
  let next='';
  if(fullGrove){
    next=canSwitch?' · 可切换竹林':'';
  }else if(segs===0){
    next=' · 再攒 <strong>'+gap+'</strong> 竹粒长第一根';
  }else if(part===0){
    next=' · 再攒 <strong>'+gap+'</strong> 竹粒开始第 '+(fullStalks+1)+' 根';
  }else{
    next=' · 再攒 <strong>'+gap+'</strong> 竹粒长下一节（第 '+(fullStalks+1)+' 根还差 '+(stalkMax-part)+' 节满）';
  }
  const ip=CONFIG.ipImage
    ? '<figure class="vol-ip"><img class="vol-ip-img" src="'+CONFIG.ipImage+'" alt="帮步 IP 形象：戴竹笋帽的竹小节娃娃和一只小熊猫"><span class="vol-ip-tag">竹小节 IP</span></figure>'
    : '';
  return '<div class="vol-growth">'
    +'<div class="vol-growth-head"><h4 class="vol-subhead">竹子成长</h4><span class="vol-growth-rule">第 '+(view+1)+' / '+count+' 片 · 每 '+per+' 竹粒长 1 节 · '+stalkMax+' 节/根</span></div>'
    +'<div class="vol-growth-scene">'
    +groveArt(segs)
    +ip
    +'</div>'
    +'<div class="vol-growth-foot">'
    +'  <p class="vol-growth-text">'+state+next+'</p>'
    +'  <button type="button" class="vol-btn vol-btn-secondary vol-btn-sm" data-act="grove-switch" aria-label="切换竹林：当前第 '+(view+1)+' 片，共 '+count+' 片"'+(canSwitch?'':' disabled title="长满 '+groveStalks+' 根 × '+stalkMax+' 节后可切换"')+'>切换竹林</button>'
    +'</div>'
    +'</div>';
}
function switchGrove(){
  const p=getProfile();
  const total=Math.floor(p.zhuli/(CONFIG.zhuliPerNode||3));
  const groveMax=(CONFIG.stalkSegments||12)*(CONFIG.groveStalks||12);
  const count=Math.floor(total/groveMax)+1;
  if(count<=1){
    const msg='长满 '+(CONFIG.groveStalks||12)+' 根 × '+(CONFIG.stalkSegments||12)+' 节后可切换竹林';
    toast(msg); live(msg); return;
  }
  S.groveView=((typeof S.groveView==='number'?S.groveView:0)+1)%count;
  renderMine(false);
  focusEl('[data-act="grove-switch"]');
  const msg='已切换到第 '+(S.groveView+1)+' / '+count+' 片竹林';
  toast(msg); live(msg);
}

/* ============================================================
   流程动作
   ============================================================ */
function startWizard(){
  const c=S.collect;
  c.screen='wizard';
  c.step=1;
  c.draft={id:null,place:'',lat:null,lng:null,status:'',note:null};
  c.photo=null;
  c.result=null;
  c.loading=false;
  c.geo='idle'; c.geoMsg='';
  if(S.markRec) S.markRec.reset();
  requestGeo();
  renderCollect(true);
  live('进入第 1 步：确认位置');
}

function requestGeo(){
  const c=S.collect;
  if(!c.draft) return;
  if(c.geo==='pending') return;
  const tok=++geoTok;
  c.geo='idle'; c.geoMsg='';
  if(!navigator.geolocation){
    c.geo='fail'; c.geoMsg='浏览器不支持定位';
    refreshGeoText();
    return;
  }
  c.geo='pending';
  refreshGeoText();
  navigator.geolocation.getCurrentPosition(function(pos){
    if(tok!==geoTok) return;
    const d=S.collect.draft;
    if(!d) return;
    S.collect.geo='ok';
    d.lat=Math.round(pos.coords.latitude*1e6)/1e6;
    d.lng=Math.round(pos.coords.longitude*1e6)/1e6;
    refreshGeoText();
    live('位置已获取，请确认点位名称');
  },function(e){
    if(tok!==geoTok) return;
    S.collect.geo='fail';
    S.collect.geoMsg=(e&&e.code===1)?'定位权限被拒绝':(e&&e.code===3)?'定位超时':'定位不可用';
    refreshGeoText();
    live('未能获取定位，请手动填写点位名称');
  },{enableHighAccuracy:false,timeout:8000,maximumAge:60000});
}

function wizardExit(){
  const c=S.collect;
  const R=S.markRec;
  const dirty=Boolean(R.blob || R.state==='recording' || R.state==='stopping' || c.photo || c.draft?.summary);
  if(!dirty){ leaveWizard(); return; }
  openDialog({
    title:'放弃这次采集？',
    desc:'已经录好的声音、文字和照片都不会保存。',
    confirmText:'放弃并退出',
    cancelText:'继续采集',
    danger:true,
    onConfirm:leaveWizard
  });
}
function leaveWizard(){
  const c=S.collect;
  if(c.draft?.cloudDraft) discardDraftUploads(c.draft.cloudDraft);
  if(S.markRec) S.markRec.reset();
  if(c.photo&&c.photo.url){ try{ URL.revokeObjectURL(c.photo.url); }catch(e){} }
  c.screen='home';
  c.step=1;
  c.draft=null;
  c.photo=null;
  c.result=null;
  c.loading=false;
  geoTok++;
  renderCollect(true);
  live('已退出采集向导');
}

function goStep(n){
  const c=S.collect;
  if(c.screen!=='wizard') return;
  const target=Math.max(1,Math.min(5,n));
  if(c.step===2 && target!==2) S.markRec.stop();
  c.step=target;
  renderCollect(true);
}
function stepNext(){
  const c=S.collect;
  if(c.screen!=='wizard') return;
  if(c.step===1){
    const place=(c.draft.place||'').trim();
    if(place.length<2){ formError('点位名称至少写 2 个字，例如「人民广场东南角」',$('#volPlace')); return; }
    c.step=2;
    renderCollect(true);
    return;
  }
  if(c.step===2){
    if(S.markRec.state==='recording'||S.markRec.state==='stopping'){
      formError('请先停止录音，等录音准备好后再继续。'); return;
    }
    if(!S.markRec.blob){ formError('请录制或选择一段音频。'); return; }
    if(!(c.draft.summary||'').trim()){ formError('请填写路标文字描述。',$('#volRouteSummary')); return; }
    c.step=3; renderCollect(true); return;
  }
  if(c.step===3){
    if(!c.draft.status){ formError('请选择盲道状态；不确定就选「未知」',$('[data-choice="未知"]')); return; }
    c.step=4; renderCollect(true); return;
  }
  if(c.step===4){ c.step=5; renderCollect(true); return; }
}
function stepPrev(){
  const c=S.collect;
  if(c.screen!=='wizard') return;
  if(c.step<=1){ wizardExit(); return; }
  if(c.step===2) S.markRec.stop();
  c.step=Math.max(1,c.step-1);
  renderCollect(true);
}
function stepSkip(){
  const c=S.collect;
  if(c.screen!=='wizard') return;
  if(c.step===2){
    S.markRec.stop();
    c.step=3; renderCollect(true); return;
  }
  if(c.step===3){
    // 已经选过就保留原选择；完全没选才按「未知」记录
    if(!c.draft.status){
      c.draft.status='未知';
      toast('已按「未知」记录');
    }
    c.step=4; renderCollect(true); return;
  }
  if(c.step===4){ c.step=5; renderCollect(true); return; }
}

function setBlindStatus(val,focus){
  const c=S.collect;
  if(!c.draft) return;
  c.draft.status=val;
  $$('[role="radio"]').forEach(function(b){
    const isOn=b.getAttribute('data-choice')===val;
    b.setAttribute('aria-checked',isOn?'true':'false');
    b.tabIndex=isOn?0:-1;
    const base=b.getAttribute('data-base-label')||'';
    b.setAttribute('aria-label',base+(isOn?'，已选中':''));
  });
  const line=$('#volSelected');
  if(line) line.textContent='已选中：'+val;
  if(focus){
    const target=$$('[role="radio"]').filter(function(b){return b.getAttribute('data-choice')===val;})[0];
    if(target) target.focus();
  }
}

function switchToText(R,kind){
  if(!R) return;
  R.stop();
  R.mode='text';
  R.state='text';
  if(kind==='mark') markRecChanged(); else pcRecChanged();
  setTimeout(function(){ focusEl(kind==='mark'?'#volMarkText':'#volPcText'); },0);
  toast('已切换为文字描述');
  live('已切换为文字描述，可以用输入法的语音输入');
}
function switchToAudio(R,kind){
  if(!R) return;
  R.mode='audio';
  R.state=R.blob?'ready':'idle';
  if(kind==='mark') markRecChanged(); else pcRecChanged();
}


function handlePhoto(e){
  const input=e.target;
  if(!input||input.id!=='volPhotoInput') return;
  const f=input.files&&input.files[0];
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast('请选择图片文件'); input.value=''; return; }
  if(f.size>8*1024*1024){ toast('图片超过 8MB，请换一张小一点的'); input.value=''; return; }
  const c=S.collect;
  if(c.photo&&c.photo.url){ try{ URL.revokeObjectURL(c.photo.url); }catch(e){} }
  c.photo={blob:f,url:URL.createObjectURL(f),name:f.name||'环境照片'};
  input.value='';
  renderCollect(false);
  focusEl('[data-act="photo-pick"]');
  toast('照片已添加');
  live('照片已添加，可以继续下一步');
}

async function submitMark(){
  const c=S.collect;
  const user=cloudSession?.user;
  if(!user || c.loading || c.screen!=='wizard') return;
  const d=c.draft;
  const audio=S.markRec.blob;
  const summary=(d.summary||'').trim();
  if(!audio || !summary){ goStep(2); formError('请添加录音并填写文字描述。'); return; }
  c.loading=true;
  const button=$('[data-act="submit"]');
  if(button){ button.disabled=true; button.textContent='正在上传…'; }
  try{
    const draft=d.cloudDraft ||= {stage:0};
    Object.assign(draft,{
      place:d.place,summary,audio,photos:{before:c.photo?.blob},
      path:{status:pagePathCodes[d.status] ?? 'unknown'},
      capture:{latitude:d.lat,longitude:d.lng,audio_seconds:S.markRec.secs ? Math.min(180,Math.max(1,Math.round(S.markRec.secs))) : null}
    });
    const id=await submitCloudRoute(draft,'竹小节'+user.id.slice(0,6).toUpperCase());
    draft.stage=4;
    if(cloudSession?.user.id!==user.id || c.draft!==d) return;
    const place=d.place;
    leaveWizard();
    c.result={id,place};
    c.screen='result';
    c.step=6;
    renderCollect(true);
    live('提交成功，等待人工审核。');
    BambooDB.refresh().catch(error=>console.warn('Could not refresh submissions',error));
  }catch(error){
    console.warn('Could not submit route',error);
    if(cloudSession?.user.id===user.id && c.draft===d){
      const message=error instanceof Error ? error.message : '云端暂时无法保存路标，请重试。';
      formError(message);
    }
  }finally{
    if(c.draft===d) c.loading=false;
    if(button){ button.disabled=false; button.textContent='提交'; }
  }
}

function showTab(tab,focus){
  if(['collect','postcard','mine'].indexOf(tab)<0) tab='collect';
  if(S.tab!==tab){
    if(S.markRec) S.markRec.stop();
    if(S.pcRec) S.pcRec.stop();
  }
  S.tab=tab;
  const map={collect:'volPanelCollect',postcard:'volPanelPostcard',mine:'volPanelMine'};
  Object.keys(map).forEach(function(k){
    const p=document.getElementById(map[k]);
    if(p) p.hidden=(k!==tab);
  });
  $$('.vol-tab').forEach(function(b){
    if(b.getAttribute('data-tab')===tab) b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  });
  if(tab==='collect') renderCollect(!!focus);
  else if(tab==='postcard') renderPostcard(!!focus);
  else {
    renderMine(!!focus);
    BambooDB.refresh().then(loaded=>{ if(loaded && S.tab==='mine') renderMine(false); })
      .catch(()=>toast('暂时无法读取投稿，请点「刷新路标」重试。'));
  }
}

/* ============================================================
   事件
   ============================================================ */
function onRootClick(e){
  if(!started) return;
  const t=e.target;
  if(!t||!t.closest) return;
  const tabBtn=t.closest('[data-tab]');
  if(tabBtn){ showTab(tabBtn.getAttribute('data-tab'),true); return; }
  const choice=t.closest('[data-choice]');
  if(choice){ setBlindStatus(choice.getAttribute('data-choice'),true); return; }
  const el=t.closest('[data-act]');
  if(!el) return;
  handleAct(el.getAttribute('data-act'),el).catch(function(err2){
    console.error(err2);
    formError('操作失败，请重试。');
  });
}

function onField(e){
  if(e.target.id==='volRouteSummary' && S.collect.draft){ S.collect.draft.summary=e.target.value; return; }
  const t=e.target;
  if(!t||!t.getAttribute) return;
  if(t.getAttribute('aria-invalid')) t.removeAttribute('aria-invalid');
  const field=t.getAttribute('data-field');
  if(field==='place'){
    if(S.collect.draft){ S.collect.draft.place=t.value; refreshGeoText(); }
  }else if(field==='markText'){
    if(S.markRec) S.markRec.text=t.value;
  }else if(field==='pcText'){
    S.pc.text=t.value;
  }else if(field==='pcPlace'){
    S.pc.placeId=t.value;
  }
}

function onKeydown(e){
  const t=e.target;
  if(!t||!t.closest) return;
  const radio=t.closest('[role="radio"]');
  if(!radio) return;
  const keys=['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','End'];
  if(keys.indexOf(e.key)<0) return;
  e.preventDefault();
  const group=radio.closest('[role="radiogroup"]');
  const list=group?$$('[role="radio"]',group):[];
  if(!list.length) return;
  let idx=list.indexOf(radio);
  if(idx<0) idx=0;
  let n=idx;
  if(e.key==='ArrowDown'||e.key==='ArrowRight') n=(idx+1)%list.length;
  if(e.key==='ArrowUp'||e.key==='ArrowLeft') n=(idx-1+list.length)%list.length;
  if(e.key==='Home') n=0;
  if(e.key==='End') n=list.length-1;
  const val=list[n].getAttribute('data-choice');
  setBlindStatus(val,true);
}

function onDocClick(e){
  if(!started) return;
  const menu=$('#volSwitchMenu');
  if(!menu||menu.hidden) return;
  const t=e.target;
  if(t&&t.closest&&t.closest('.vol-menuwrap')) return;
  toggleMenu(false);
}

function onDocKeydown(e){
  if(e.key!=='Escape') return;
  const layer=$('#volDialogLayer');
  if(layer&&!layer.hidden){ closeDialog(false); return; }
  const menu=$('#volSwitchMenu');
  if(menu&&!menu.hidden){
    toggleMenu(false);
    focusEl('#volSwitchBtn');
  }
}

function onMenuKey(e){
  const menu=$('#volSwitchMenu');
  if(!menu||menu.hidden) return;
  const items=$$('a',menu);
  if(!items.length) return;
  if(e.key==='Escape'){ e.preventDefault(); toggleMenu(false); focusEl('#volSwitchBtn'); return; }
  if(e.key==='Tab'){ toggleMenu(false); return; }
  if(['ArrowDown','ArrowUp','Home','End'].indexOf(e.key)<0) return;
  e.preventDefault();
  let idx=items.indexOf(document.activeElement);
  let n=0;
  if(e.key==='ArrowDown') n=(idx+1)%items.length;
  if(e.key==='ArrowUp') n=(idx-1+items.length)%items.length;
  if(e.key==='Home') n=0;
  if(e.key==='End') n=items.length-1;
  items[n].focus();
}

function onDialogBackdrop(e){
  const layer=$('#volDialogLayer');
  if(e.target===layer) closeDialog(false);
}

async function handleAct(act,el){
  if(S.collect.loading && !['large','identity'].includes(act)) return;
  if(act==='large'){
    const on=!document.documentElement.classList.contains('bb-large');
    applyLarge(on);
    toast(on?'A+ 已开启放大模式':'已关闭放大模式');
    live(on?'已开启放大模式，字号变大':'已关闭放大模式');
    return;
  }
  if(act==='identity'){ toggleMenu(); return; }
  if(act==='start'){ startWizard(); return; }
  if(act==='geo'){ requestGeo(); return; }
  if(act==='edit-place'){ focusEl('#volPlace'); return; }
  if(act==='speak'){ speak(CONFIG.guidePrompt); live('正在朗读引导提示词'); return; }
  if(act==='wizard-exit'){ wizardExit(); return; }
  if(act==='step-prev'){ stepPrev(); return; }
  if(act==='step-next'){ stepNext(); return; }
  if(act==='step-skip'){ stepSkip(); return; }
  if(act==='submit'){ await submitMark(); return; }
  if(act==='again'){ startWizard(); return; }
  if(act==='goto-mine'){ showTab('mine',true); return; }
  if(act==='goto-collect'){ showTab('collect',true); return; }
  if(act==='grove-switch'){ switchGrove(); return; }
  if(act==='goto-home'){
    S.collect.screen='home'; S.collect.draft=null; S.collect.photo=null;
    renderCollect(true); return;
  }
  if(act==='rec-start'){ await S.markRec.start(); return; }
  if(act==='rec-stop'){ S.markRec.stop(); return; }
  if(act==='rec-retry'){ await S.markRec.start(); return; }
  if(act==='rec-redo'){ S.markRec.discard(); markRecChanged(); return; }
  if(act==='photo-pick'){ const f=$('#volPhotoInput'); if(f) f.click(); return; }
  if(act==='photo-remove'){ removePhoto(); return; }
  if(act==='dialog-ok'){ closeDialog(true); return; }
  if(act==='dialog-cancel'){ closeDialog(false); return; }
  if(act==='edit-step'){
    const n=parseInt(el.getAttribute('data-step'),10)||1;
    if(S.collect.step===2) S.markRec.stop();
    S.collect.step=Math.max(1,Math.min(5,n));
    renderCollect(true);
    return;
  }
}

function bindGlobal(){
  if(bound) return;
  bound=true;
  const root=$('#view-vol');
  on(root,'click',onRootClick);
  on(root,'input',onField);
  on(root,'change',onField);
  on(root,'change',function(e){
    if(e.target?.id==='volPhotoInput') handlePhoto(e);
    if(e.target?.id==='volAudioFile'){
      const file=e.target.files[0];
      if(!file) return;
      try{ validateRouteMedia(file,'audio'); }catch(error){ formError(error.message); return; }
      const recorder=S.markRec;
      recorder.reset();
      recorder.loadBlob(file,0);
      renderCollect(false);
      live('录音文件已添加。');
    }
  });
  on(root,'keydown',onKeydown);
  on(document,'click',onDocClick);
  on(document,'keydown',onDocKeydown);
  on($('#volSwitchMenu'),'keydown',onMenuKey);
  on($('#volDialogLayer'),'keydown',onDialogKey);
  on($('#volDialogLayer'),'click',onDialogBackdrop);
}

/* ============================================================
   初始化 / 销毁
   ============================================================ */
function init(){
  if(started) return;
  started=true;
  document.title=CONFIG.appTitle;
  const s=readLS('app_bamboo_settings',{})||{};
  document.documentElement.classList.toggle('bb-large',!!s.large);
  syncLargeBtn();
  buildMenu();
  const grove=$('#volGrove');
  if(grove) grove.innerHTML=bambooOutline();
  getProfile();
  S.tab='collect';
  S.collect.screen='home';
  S.collect.draft=null;
  S.collect.photo=null;
  if(!S.markRec) S.markRec=createRecorder('mark',180,markRecChanged);
  bindGlobal();
  $$('.vol-panel').forEach(function(p){ p.hidden=(p.id!=='volPanelCollect'); });
  renderCollect(false);
  renderMine(false);
  renderPostcard(false);
  setupPageAccount({role:'volunteer',store:BambooDB,content:[$('#volMain'),$('.vol-tabbar')],
    render(){
      if(S.tab==='mine') renderMine(false);
      if(S.tab==='collect' && S.collect.screen==='home') renderCollect(false);
    },
    onSessionEnd(){ leaveWizard(); showTab('collect',false); },
    beforeSignOut(){
      const draft=S.collect.draft?.cloudDraft;
      if(draft) return discardDraftUploads(draft);
    },
    canSignOut(){
      if(S.collect.loading){ toast('请等当前路标上传完成。'); return false; }
      return true;
    }
  });
}

function destroy(){
  started=false;
  geoTok++;
  S.pc.token++;
  if(S.markRec) S.markRec.destroy();

  if('speechSynthesis' in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  if(toastTimer){ clearTimeout(toastTimer); toastTimer=null; }
  if(liveTimer){ clearTimeout(liveTimer); liveTimer=null; }
  if(S.collect.photo&&S.collect.photo.url){ try{ URL.revokeObjectURL(S.collect.photo.url); }catch(e){} }
  S.collect.photo=null;
  closeDialog(false);
  toggleMenu(false);
  const t=$('#volToast'); if(t) t.hidden=true;
  unbindAll();
}

/* 末尾仅暴露 init / destroy（公共契约 4.6） */
window.BambooVolunteer={init:init,destroy:destroy};

/* 脚本就位于页面末尾：解析完成即可进入视图 */
init();

})();
</script>
