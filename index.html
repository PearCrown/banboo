<!DOCTYPE html>
<html lang="zh-CN" data-role="volunteer" data-theme="brand" data-font="normal" data-cvd="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2E6B4F">
<title>帮步 Bamboo · 你走过的路，成为ta的眼睛</title>
<style>
  :root{
    --bg:#F3EFE6; --card:#FFFDF7; --ink:#22332C; --muted:#64766D;
    --green:#2E6B4F; --green2:#3F8A63; --gold:#C9A227; --line:#DDE5DE;
    --ok:#2E6B4F; --warn:#C9A227; --danger:#C05B4D; --info:#3B5B8C;
    --radius:18px; --tab:64px; --shadow:0 6px 20px rgba(34,51,44,.08);
    --font-display:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
    --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:#E4DED0;color:var(--ink);line-height:1.55;
    font-family:var(--font-body);font-size:15px;
  }
  #app{
    max-width:440px;margin:0 auto;height:100dvh;background:var(--bg);
    position:relative;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 0 40px rgba(34,51,44,.18);
  }
  #view{
    flex:1;overflow-y:auto;scroll-behavior:smooth;
    padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 18px);
  }
  .hidden{display:none !important}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  :focus-visible{outline:3px solid #C9A227;outline-offset:2px}
  #view h1:focus{outline:none}
  button{font-family:inherit}
  a{color:var(--green)}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:48px;padding:0 18px;border-radius:999px;border:0;
    font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s;
    text-decoration:none;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(145deg,var(--green2),var(--green));color:#fff;box-shadow:0 6px 16px rgba(46,107,79,.35)}
  .btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.45)}
  .btn-outline{background:transparent;border:1.5px solid var(--green);color:var(--green)}
  .btn-soft{background:#E8F0EA;color:var(--green)}
  .btn-block{width:100%}
  .btn-danger{background:var(--danger);color:#fff}
  .link{background:none;border:0;color:var(--green);font-weight:700;font-size:13px;cursor:pointer;padding:6px}

  /* ---------- role gate ---------- */
  .role-gate{
    position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#1E3A2C,#2E6B4F);
    display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;
  }
  .role-inner{width:100%;max-width:420px;color:#fff}
  .role-logo{font-size:54px;text-align:center;line-height:1}
  .role-inner h1{font-size:30px;text-align:center;margin:10px 0 6px}
  .role-inner > p{text-align:center;color:#DCE8DF;font-size:14px;line-height:1.6;margin:0 0 4px}
  .role-card{
    display:flex;align-items:center;gap:14px;width:100%;min-width:0;text-align:left;
    background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);
    border-radius:18px;padding:16px;margin-top:12px;color:#fff;cursor:pointer;
  }
  .role-card > span:last-child{flex:1;min-width:0}
  .role-card b{display:block;font-size:17px;overflow-wrap:anywhere}
  .role-card small{display:block;color:#DCE8DF;font-size:12px;line-height:1.5;margin-top:3px;overflow-wrap:anywhere}
  .role-ico{font-size:30px;flex:0 0 44px;text-align:center}
  .role-note{font-size:11px;color:#BFD3C6;margin-top:16px;text-align:center;line-height:1.6}

  /* ---------- hero ---------- */
  .hero{
    position:relative;overflow:hidden;color:#F2F6EE;
    padding:calc(40px + env(safe-area-inset-top)) 22px 30px;border-radius:0 0 28px 28px;
    background:linear-gradient(160deg,#1E3A2C 0%,#2E6B4F 55%,#3F8A63 100%);
  }
  .hero::after{
    content:"";position:absolute;inset:auto -40px -80px -40px;height:180px;
    background:radial-gradient(ellipse at center,rgba(201,162,39,.22),transparent 70%);
    pointer-events:none;
  }
  .hero-bamboo{position:absolute;right:-12px;bottom:-22px;width:140px;height:300px;opacity:.9;pointer-events:none}
  .hero-badge{
    display:inline-block;font-size:10px;letter-spacing:.1em;
    padding:5px 10px;border:1px solid rgba(255,255,255,.3);border-radius:999px;
    color:#E8F0EA;background:rgba(255,255,255,.08);
  }
  .hero h1{
    font-family:var(--font-display);font-size:34px;line-height:1.2;
    margin:14px 0 10px;font-weight:800;letter-spacing:-.01em;position:relative;z-index:1;
  }
  .hero h1 em{font-style:normal;color:#F2D27A}
  .hero-sub{margin:0 0 18px;font-size:15px;color:#DCE8DF;max-width:330px;position:relative;z-index:1}
  .hero-actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
  .hero-proof{margin:16px 0 0;font-size:12px;color:#CFE0D5;position:relative;z-index:1}
  .hero-proof b{color:#fff}

  /* ---------- stats / sections ---------- */
  .stats{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
  .stat{flex:1;text-align:center;padding:14px 6px;border-right:1px solid var(--line)}
  .stat:last-child{border-right:0}
  .stat b{display:block;font-size:20px;color:var(--green);line-height:1.2}
  .stat span{font-size:11px;color:var(--muted)}

  .section{padding:18px 18px 4px}
  .section h2{font-size:18px;margin:0 0 12px;font-weight:800;display:flex;align-items:center;gap:8px}
  .section h2::before{
    content:"";display:inline-block;width:14px;height:10px;flex:0 0 auto;
    background:var(--green);border-radius:80% 0 80% 0;transform:rotate(-20deg);
  }
  .page-head{padding:26px 20px 10px}
  .page-head h1{font-size:26px;margin:0 0 2px;font-weight:800}
  .page-head p{margin:0;color:var(--muted);font-size:13px}

  .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .flow div{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center;font-size:11px;box-shadow:var(--shadow)}
  .flow b{display:block;color:var(--green);font-size:12px;margin-bottom:3px}

  .mark-card{
    background:var(--card);border-radius:var(--radius);padding:14px;
    box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;
    border:1px solid rgba(34,51,44,.04);
  }
  .mark-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .mark-title{font-size:16px;font-weight:800;line-height:1.35}
  .score-mini{
    flex:0 0 auto;min-width:44px;height:32px;border-radius:10px;background:#F7F0DA;
    color:#8A6D2F;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;
  }
  .mark-meta{font-size:12px;color:var(--muted);margin-top:4px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{font-size:11px;padding:4px 9px;border-radius:999px;background:#E8F0EA;color:var(--green)}
  .chip.path-ok{background:#E8F0EA;color:var(--ok)}
  .chip.path-warn{background:#F7F0DA;color:var(--warn)}
  .chip.path-unknown{background:#EEF0EE;color:var(--muted)}
  .chip.path-blocked{background:#F7F0DA;color:#8A6D2F}
  .mark-trust{font-size:12px;color:var(--green);margin-top:8px;font-weight:600}
  .mark-trust.warn{color:var(--warn)}

  .gap{
    background:linear-gradient(135deg,#F7F0DA,#EFE3BF);border-radius:18px;padding:16px;
    display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  }
  .gap p{margin:0;font-size:13px;line-height:1.5;flex:1;min-width:180px}
  .gap b{font-size:14px}

  .trust{background:#fff;border-radius:18px;padding:14px;font-size:12px;color:var(--muted);line-height:1.7}
  .trust b{color:var(--ink)}

  /* ---------- map ---------- */
  .map-canvas{
    position:relative;height:290px;border-radius:18px;overflow:hidden;
    background:
      linear-gradient(90deg,rgba(46,107,79,.06) 1px,transparent 1px) 0 0/40px 40px,
      linear-gradient(rgba(46,107,79,.06) 1px,transparent 1px) 0 0/40px 40px,
      #DCE8DF;
    border:1px solid var(--line);
  }
  .map-canvas::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.7),transparent 45%),
               radial-gradient(circle at 75% 70%,rgba(255,255,255,.5),transparent 40%);
  }
  .pin{
    position:absolute;width:28px;height:28px;border-radius:50%;border:3px solid #fff;
    background:var(--ok);color:#fff;font-size:11px;font-weight:800;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.22);z-index:2;
  }
  .pin.warn{background:var(--warn);background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.18) 0 3px,transparent 3px 6px)}
  .pin.unknown{background:#fff;color:var(--muted);border:2px dashed var(--muted)}
  .pin.ok::after{
    content:"";position:absolute;inset:-6px;border-radius:50%;
    border:2px solid var(--ok);animation:pulse 2s infinite;
  }
  @keyframes pulse{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.6);opacity:0}}
  .map-note{font-size:11px;color:var(--muted);margin:6px 2px 0}

  /* ---------- record ---------- */
  .steps{display:flex;gap:6px;padding:0 18px 12px}
  .steps span{flex:1;height:4px;border-radius:2px;background:#DCE5DE}
  .steps span.on{background:var(--green)}
  .record-wrap{padding:0 18px}
  .rec-card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
  .rec-question{font-size:16px;font-weight:800;line-height:1.45;margin:0}
  .rec-example{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
  .rec-select{width:100%;margin-top:12px;padding:12px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;background:#fff}
  .rec-input{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;background:#fff}
  .mic-big{
    width:96px;height:96px;border-radius:50%;border:0;margin:18px auto 8px;display:flex;
    align-items:center;justify-content:center;font-size:34px;cursor:pointer;
    background:linear-gradient(145deg,var(--green2),var(--green));color:#fff;
    box-shadow:0 10px 24px rgba(46,107,79,.35);
  }
  .mic-big.recording{animation:breathe 1.2s infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .rec-timer{text-align:center;font-size:26px;font-weight:800;letter-spacing:.04em}
  .rec-timer small{font-size:12px;color:var(--muted);font-weight:400}
  .wave{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:46px;margin:10px 0}
  .wave i{width:4px;background:var(--green2);border-radius:2px;height:8px;animation:wave 1s infinite ease-in-out}
  .wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}
  .wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
  .wave i:nth-child(6){animation-delay:.5s}.wave i:nth-child(7){animation-delay:.6s}
  @keyframes wave{0%,100%{height:8px}50%{height:34px}}
  .prompts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .prompt{display:flex;gap:8px;font-size:12px;color:var(--muted);line-height:1.5}
  .prompt b{flex:0 0 18px;height:18px;border-radius:50%;background:#E8F0EA;color:var(--green);font-size:10px;display:flex;align-items:center;justify-content:center}
  .ai-steps{display:flex;flex-direction:column;gap:10px;margin:14px 0}
  .ai-step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .ai-step i{width:20px;height:20px;border-radius:50%;border:2px solid #DCE5DE;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
  .ai-step.done{color:var(--ink)}
  .ai-step.done i{background:var(--green);border-color:var(--green);color:#fff}
  .score-row{display:flex;gap:14px;align-items:center}
  .score{
    flex:0 0 76px;width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--green) 0 86%,#E5EDE7 86% 100%);
  }
  .score span{width:58px;height:58px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--green)}
  .score-label{font-size:13px;font-weight:800}
  .score-sub{font-size:11px;color:var(--muted)}
  .summary{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:14px;line-height:1.6;background:#fff;resize:vertical;margin-top:10px}
  textarea:focus{outline:3px solid rgba(201,162,39,.35);border-color:var(--gold)}
  .rec-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .rec-actions .btn{flex:1;min-width:120px}

  .path-box{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:14px;background:#fff}
  .path-btns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .path-btn{
    min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
    font-size:14px;font-weight:700;text-align:left;padding:0 12px;cursor:pointer;color:var(--ink);
  }
  .path-btn.on{border-color:var(--green);background:#E8F0EA;color:var(--green)}
  .photo-row{display:flex;gap:10px;margin-top:10px}
  .photo-input{flex:1;border:1.5px dashed var(--line);border-radius:12px;padding:10px;font-size:12px;text-align:center;cursor:pointer;background:#fff}
  .photo-input input{display:none}
  .photo-preview{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .photo-preview img{width:72px;height:72px;object-fit:cover;border-radius:10px}

  /* ---------- listen ---------- */
  .listen-card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
  .listen-actions{display:flex;gap:10px;flex-wrap:wrap}
  .transcript{font-size:18px;line-height:1.8;margin:14px 0;padding:14px;background:#fff;border-radius:14px;border:1px solid var(--line)}
  .verify{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .verify .btn{min-height:56px;font-size:16px}
  .safety{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}
  .trust-line{font-size:12px;color:var(--green);font-weight:700;margin-top:10px}
  .path-status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:12px;border-radius:12px;background:#F7F0DA;font-size:12px}
  .path-status-row b{font-size:13px}

  /* ---------- gesture ---------- */
  .gesture-pad{
    margin-top:14px;border:2px dashed var(--line);border-radius:18px;padding:16px;
    text-align:center;touch-action:none;user-select:none;background:#fff;
  }
  .gesture-hint{font-size:13px;color:var(--muted);line-height:1.8}
  .gesture-status{margin-top:8px;font-size:16px;font-weight:800;color:var(--green);min-height:24px}
  .gesture-pad:active{border-color:var(--green)}

  /* ---------- me ---------- */
  .me-card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
  .me-top{display:flex;align-items:center;gap:12px}
  .avatar{
    width:54px;height:54px;border-radius:50%;background:#E8F0EA;border:2px solid transparent;
    display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;
  }
  .me-name{font-weight:800;font-size:17px}
  .me-sub{font-size:12px;color:var(--muted)}
  .me-points{margin-left:auto;text-align:right}
  .me-points b{display:block;font-size:24px;color:var(--green)}
  .me-points span{font-size:11px;color:var(--muted)}
  .zhuli{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .zhuli-num{font-size:34px;font-weight:800;color:var(--green);line-height:1}
  .zhuli-num small{font-size:12px;color:var(--muted);font-weight:600}
  .zhuli p{margin:2px 0 0;font-size:12px;color:var(--muted)}

  .bamboo-cute{position:relative;width:96px;display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px auto}
  .bamboo-node{
    width:66px;height:30px;border-radius:50% 50% 45% 45%;
    background:linear-gradient(180deg,#4E9A6E,#2E6B4F);
    box-shadow:inset -6px -4px 0 rgba(0,0,0,.08),inset 6px 4px 0 rgba(255,255,255,.14);
    position:relative;
  }
  .bamboo-node.off{background:#DCE5DE;box-shadow:none}
  .bamboo-node .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;letter-spacing:1px}
  .bamboo-leaf{position:absolute;width:36px;height:16px;background:#3F8A63;border-radius:80% 0 80% 0;transform:rotate(-28deg);top:2px;left:-20px;opacity:.95}
  .bamboo-leaf.leaf-b{left:auto;right:-20px;transform:rotate(28deg) scaleX(-1);top:18px}

  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .setting-row:last-child{border-bottom:0}
  .seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .seg button{
    min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);
    background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink);
  }
  .seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
  .setting-select{min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:13px;padding:0 8px;color:var(--ink)}

  /* ---------- modal / toast ---------- */
  .modal-mask{
    position:fixed;inset:0;background:rgba(20,30,25,.55);z-index:150;
    display:flex;align-items:flex-end;justify-content:center;padding:18px;
  }
  .modal-card{
    width:100%;max-width:440px;background:var(--card);border-radius:24px 24px 18px 18px;
    padding:20px;box-shadow:var(--shadow);max-height:86vh;overflow-y:auto;
  }
  .modal-card h2{font-size:20px;margin:0 0 8px}
  .modal-actions{display:flex;gap:10px;margin-top:14px}
  .modal-actions .btn{flex:1}
  .avatar-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .avatar-opt{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:26px;cursor:pointer}
  .avatar-opt.on{border-color:var(--green);background:#E8F0EA}

  .postcard{
    background:linear-gradient(160deg,#1E3A2C,#2E6B4F);color:#F2F6EE;
    border-radius:18px;padding:18px;position:relative;overflow:hidden;
  }
  .postcard::after{content:"🎋";position:absolute;right:-6px;bottom:-16px;font-size:88px;opacity:.16}
  .postcard h3{margin:0 0 4px;font-size:18px}
  .postcard p{margin:0;font-size:12px;color:#DCE8DF;line-height:1.6}
  .postcard .postcard-text{font-size:15px;color:#fff;margin:10px 0 14px;line-height:1.7}

  .demo-note{text-align:center;font-size:11px;color:var(--muted);padding:18px 20px 8px;line-height:1.6}

  /* ---------- tabbar ---------- */
  #tabbar{
    position:absolute;left:0;right:0;bottom:0;z-index:30;
    height:calc(var(--tab) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(255,253,247,.96);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;align-items:flex-end;
  }
  .tab{
    flex:1;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer;
  }
  .tab.on{color:var(--green);font-weight:800;box-shadow:inset 0 3px 0 var(--green);text-decoration:underline;text-underline-offset:5px}
  .tab .ico{font-size:18px;line-height:1}
  .tab.center{position:relative}
  .tab .mic{
    width:54px;height:54px;border-radius:50%;margin-top:-28px;border:3px solid var(--bg);
    background:linear-gradient(145deg,var(--green2),var(--green));color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:22px;
    box-shadow:0 8px 18px rgba(46,107,79,.4);
  }

  #toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);

  { id:105, place:'图书馆西门 · 旋转门', area:'省图书馆', distance:'560m',
    tags:['旋转门','求助','安静'], score:81, recorder:'老陈', days:5, uses:6, verified:1,
    summary:'西门是旋转门，旁边有工作人员通道；按门铃说明需要引导，会有人出来接。馆内很安静，脚步声清楚。',
    x:20, y:72, status:'ok', blindPath:{status:'ok', at:'5 天前', checks:1} },
  { id:106, place:'学校南门 · 减速带', area:'川大望江', distance:'150m',
    tags:['减速带','电动车','树荫'], score:70, recorder:'小何', days:1, uses:2, verified:0,
    summary:'南门进门后连续两条减速带，右侧是电动车停放区；沿左侧树荫走，尽头是教学楼无障碍入口。',
    x:52, y:20, status:'unknown', blindPath:{status:'unknown', at:'12 天前', checks:0} }
];

let state = loadState();
let rec = newDraft();
let gestureSel = null;
let speakOnOpen = false;
let selectedAvatar = state.profile.avatar;
let modalConfirm = null;

const MIC_SVG = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>';
const STOP_SVG = '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"></rect></svg>';

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.marks)){
        s.profile = s.profile || {nick:'竹小节',avatar:'🎋'};
        s.settings = s.settings || {theme:'brand',font:'normal',cvd:'default',haptics:true,speech:true};
        s.points = s.points || 30;
        s.helped = typeof s.helped === 'number' ? s.helped : 12;
        return s;
      }
    }
  }catch(e){}
  return {
    role:'', marks:seed.map(m => JSON.parse(JSON.stringify(m))), points:30, helped:12,
    profile:{nick:'竹小节',avatar:'🎋'},
    settings:{theme:'brand',font:'normal',cvd:'default',haptics:true,speech:true}
  };
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  }catch(e){ return false; }
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2400);
}
function announce(msg){
  const el = document.getElementById('live');
  if(!el) return;
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 60);
}
function vibrate(pattern){
  if(!state.settings.haptics) return;
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}
function speak(text, slow){
  if(!state.settings.speech) return;
  if(window.BangbuDevice){
    window.BangbuDevice.speak(text, Boolean(slow));
    return;
  }
  if(!state.settings.speech) return;
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持语音播报'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = slow ? 0.72 : 0.88;
  speechSynthesis.speak(u);
}
function stats(){
  const marks = visibleMarks();
  return {
    total: marks.length,
    verified: marks.reduce((a,m) => a + (m.verified || 0), 0),
    uses: marks.reduce((a,m) => a + (m.uses || 0), 0),
    places: new Set(marks.map(mark => mark.place)).size
  };
}
function pathInfo(m){
  const p = m.blindPath || {status:'unknown'};
  if(p.status === 'ok' || p.status === 'cleared') return {cls:'ok', text:'盲道：畅通', detail:`畅通 · ${p.at || '今天'} · ${p.checks || 1} 人检查`};
  if(p.status === 'blocked') return {cls:'warn', text:'盲道：被占', detail:`被占 · ${p.at || '今天'}`};
  return {cls:'unknown', text:'盲道：未知', detail:'暂无盲道记录'};
}
function roleLabel(){
  if(state.role === 'blind') return '全盲模式';
  if(state.role === 'lowvision') return '半盲 / 低视力';
  return '竹小节 · 志愿者';
}
function roleDefaults(role){
  if(role === 'volunteer' || role === 'admin') return {theme:'brand', font:'normal'};
  return {theme:'contrast', font:'xlarge'};
}

/* ---------- settings ---------- */
function applySettings(){
  const r = document.documentElement;
  r.dataset.role = state.role || 'volunteer';
  r.dataset.theme = state.settings.theme;
  r.dataset.font = state.settings.font;
  r.dataset.cvd = state.settings.cvd;
}
function setTheme(t){ state.settings.theme = t; saveState(); applySettings(); go('me'); }
function setFont(f){ state.settings.font = f; saveState(); applySettings(); go('me'); }
function setCvd(c){ state.settings.cvd = c; saveState(); applySettings(); go('me'); }
function toggleHaptics(){ state.settings.haptics = !state.settings.haptics; saveState(); go('me'); }
function toggleSpeech(){ state.settings.speech = !state.settings.speech; saveState(); go('me'); }

/* ---------- role ---------- */
function showGate(){
  document.getElementById('roleGate').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}
function hideGate(){
  document.getElementById('roleGate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}
function chooseRole(role){
  state.role = role;
  const d = roleDefaults(role);
  state.settings.theme = d.theme;
  state.settings.font = d.font;
  saveState();
  hideGate();
  applySettings();
  renderTabbar();
  go(role === 'admin' ? 'review' : 'nearby');
  vibrate(30);
  if(role === 'blind'){
    setTimeout(() => announce(`已进入全盲模式。附近有 ${visibleMarks().length} 条路标。`), 350);
  }
}
function switchRole(){
  releaseListenMedia();
  state.role = '';
  saveState();
  showGate();
}

/* ---------- router ---------- */
function renderTabbar(){
  const nav = document.getElementById('tabbar');
  nav.classList.toggle('hidden',state.role === 'admin');
  if(state.role === 'admin'){ nav.innerHTML = ''; return; }
  const tabs = state.role === 'blind'
    ? [['nearby','听附近',''],['help','求助',''],['me','我的','']]
    : state.role === 'lowvision'
      ? [['nearby','听附近',''],['record','录一条',''],['me','我的','']]
      : [['nearby','附近','📍'],['record','录一条','🎙️'],['messages','消息','🔔'],['me','我的','👤']];
  const html = tabs.map(([key,label,ico]) => {
    if(key === 'record' && state.role !== 'blind'){
      return `<button class="tab center" data-tab="record" onclick="go('record')" aria-label="录一条">
        <span class="mic" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="9" y="3" width="6" height="11" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0"></path>
            <path d="M12 18v3"></path>
          </svg>
        </span><span>${label}</span></button>`;
    }
    return `<button class="tab" data-tab="${key}" onclick="go('${key}')">${ico ? `<span class="ico" aria-hidden="true">${ico}</span>` : ''}${label}</button>`;
  }).join('');
  nav.innerHTML = html;
}
function go(name, arg, sync = true){
  if(state.role === 'blind' && (name === 'record' || name === 'messages')) name = 'nearby';
  if(state.role === 'admin') name = 'review';
  else if(name === 'review') name = 'nearby';
  const view = document.getElementById('view');
  view.dataset.page = name;
  if(name !== 'record') stopMic(rec);
  releaseListenMedia();
  if(name === 'nearby') view.innerHTML = homeView();
  else if(name === 'record') view.innerHTML = recordView();
  else if(name === 'messages') view.innerHTML = messagesView();
  else if(name === 'me') view.innerHTML = meView();
  else if(name === 'help') view.innerHTML = helpView();
  else if(name === 'review') view.innerHTML = reviewView();
  else if(name === 'listen') view.innerHTML = listenView(arg);
  else view.innerHTML = homeView();

  document.querySelectorAll('.tab').forEach(b => {
    const tab = b.dataset.tab;
    b.classList.toggle('on', tab === name || (name === 'listen' && tab === 'nearby'));
  });
  if(sync) view.scrollTop = 0;
  const h = view.querySelector('h1');
  if(h && sync){ h.setAttribute('tabindex','-1'); try{ h.focus({preventScroll:true}); }catch(e){} }
  if(name === 'record'){ renderRecordBody(); }
  if(name === 'listen'){ mountListen(arg); mountListenMedia(arg); }
  if(name === 'review') mountReviewQueue();
  if(name === 'me') mountOwnRoutes();
  if(name === 'nearby' && sync) reloadPublishedRoutes(false);
  try{
    const hash = (name === 'listen' && arg) ? '#listen-' + arg : '#' + name;
    if(location.hash !== hash) history.replaceState(null, '', hash);
  }catch(e){}
}

function heroBamboo(){

      <ellipse cx="122" cy="242" rx="22" ry="7" transform="rotate(24 122 242)"/>

/* ---------- volunteer home ---------- */
function homeView(){
  if(state.role === 'blind') return blindHome();
  if(state.role === 'lowvision') return lowVisionHome();
  return volunteerHome();
}
function volunteerHome(){
  const s = stats();
  const marks = visibleMarks();
  const top = [...marks].sort((a,b) => b.uses - a.uses).slice(0,3);
  return `
  <section class="hero">
    ${heroBamboo()}
    <span class="hero-badge">AI 青年行 · 2026 高校好事计划</span>
    <h1>你走过的路，<br><em>成为ta的眼睛。</em></h1>

function setPath(status){

  if(btns[idx]) btns[idx].classList.add('on');
  vibrate(20);
}
function pathPhoto(e, which){
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  if(rec.path[which]) URL.revokeObjectURL(rec.path[which]);
  rec.path[which] = URL.createObjectURL(f);
  rec.photos[which] = f;
  const box = document.getElementById('pathPreview');
  if(box) box.innerHTML = `
    ${rec.path.before ? `<img src="${rec.path.before}" alt="清理前">` : ''}
    ${rec.path.after ? `<img src="${rec.path.after}" alt="清理后">` : ''}`;
  toast('照片已添加');
}

function setDraftAudio(draft, audio){
  if(draft.audioUrl) URL.revokeObjectURL(draft.audioUrl);
  draft.audio = audio;
  draft.audioUrl = URL.createObjectURL(audio);
}
async function toggleMic(){
  const draft = rec;
  if(draft.mediaRecorder?.state === 'recording'){
    stopMic(draft);
    return;
  }
  if(draft.requesting || draft.recordingDone) return;
  draft.requesting = true;
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    if(rec !== draft || draft.stage !== 2 || !document.getElementById('micBtn')){
      stream.getTracks().forEach(track => track.stop());
      return;
    }
    const recorder = new MediaRecorder(stream);
    const chunks = [];
    let failed = false;
    recorder.ondataavailable = event => {
      if(event.data.size) chunks.push(event.data);
    };
    recorder.onerror = () => {
      failed = true;
      stopMic(draft);
    };
    recorder.start();
    draft.mediaRecorder = recorder;
    draft.recordingDone = new Promise(resolve => {
      recorder.onstop = () => {
        stream.getTracks().forEach(track => track.stop());
        clearInterval(draft.timer);
        const audio = new Blob(chunks, {type:recorder.mimeType || chunks[0]?.type});
        if(draft === rec && !failed && audio.size) setDraftAudio(draft, audio);
        draft.recordingDone = null;
        draft.mediaRecorder = null;
        if(draft === rec && draft.stage === 2){
          updateMic(false);
          audioStatus(!failed && audio.size ? '录音已就绪，可继续填写描述。' : '录音未完成，请重试或选择已有录音。');
        }
        resolve();
      };
    });
    const started = Date.now();
    draft.seconds = 0;
    updateTimer();
    updateMic(true);
    audioStatus('正在录音');
    draft.timer = setInterval(() => {
      draft.seconds = Math.min(60, Math.floor((Date.now() - started) / 1000));
      if(draft === rec) updateTimer();
      if(draft.seconds >= 60) stopMic(draft);
    }, 250);
  }catch(e){
    stream?.getTracks().forEach(track => track.stop());
    if(draft === rec) audioStatus('无法开启麦克风。请检查权限，或选择已有录音。');
  }finally{
    draft.requesting = false;
  }
}
function audioStatus(message){
  const status = document.getElementById('audioStatus');
  if(status) status.textContent = message;
}
function updateMic(recording){
  const button = document.getElementById('micBtn');
  if(!button) return;
  button.classList.toggle('recording', recording);
  button.innerHTML = recording ? STOP_SVG : MIC_SVG;
  button.setAttribute('aria-label', recording ? '停止录音' : '开始录音');
}
function stopMic(draft){
  clearInterval(draft.timer);
  if(draft.mediaRecorder?.state === 'recording') draft.mediaRecorder.stop();
}
function updateTimer(){
  const timer = document.getElementById('recTimer');
  if(!timer) return;
  const minutes = String(Math.floor(rec.seconds / 60)).padStart(2,'0');
  const seconds = String(rec.seconds % 60).padStart(2,'0');
  timer.innerHTML = `${minutes}:${seconds} <small>/ 01:00</small>`;
}
function handleAudioFile(event){
  const file = event.target.files?.[0];
  if(!file) return;
  if(rec.requesting || rec.recordingDone){
    audioStatus('请先结束录音，再选择文件。');
    event.target.value = '';
    return;
  }
  if(!file.size || file.size > 25 * 1024 * 1024){
    audioStatus('请选择不超过 25 MB 的录音文件。');
    return;
  }
  setDraftAudio(rec, file);
  audioStatus('已选择录音，可继续填写描述。');
}
async function finishRecording(){
  const draft = rec;
  if(draft.requesting){
    audioStatus('请先处理麦克风权限提示。');
    return;
  }
  stopMic(draft);
  await draft.recordingDone;
  if(rec !== draft || draft.stage !== 2 || !document.getElementById('micBtn')) return;
  if(!draft.audio){
    audioStatus('请先录音，或选择一段已有录音。');
    return;
  }
  draft.stage = 3;
  renderRecordBody();
  document.getElementById('summary').focus();
}
async function publishMark(){
  const draft = rec;
  if(draft.saving) return;
  const summary = draft.summary.trim();
  if(!summary || !draft.audio){
    toast('请填写描述并保留一段录音');
    document.getElementById('summary')?.focus();
    return;
  }
  draft.saving = true;
  document.querySelectorAll('#record-body button, #record-body input, #record-body textarea').forEach(element => element.disabled = true);
  const saveButton = document.getElementById('saveMark');
  if(saveButton) saveButton.textContent = '正在上传…';
  announce('正在上传路标');
  try{
    await submitCloudRoute(draft,[...state.profile.nick.trim()].slice(0,40).join('') || '志愿者');
    draft.stage = 4;
    toast('已提交，等待审核');
    announce('路标已提交，等待审核');
    vibrate(30);
  }catch(error){
    const message = /^请/.test(error.message ?? '') ? error.message : '上传尚未完成，已保留当前内容。请重试。';
    toast(message);
    announce(message);
    console.warn('Cloud submission failed',error);
  }finally{
    draft.saving = false;
    if(rec === draft) renderRecordBody();
  }
}
function resetRecord(){
  if(rec.saving) return;
  const old = rec;
  rec = newDraft();
  stopMic(old);
  void discardDraftUploads(old);
  for(const url of [old.audioUrl, old.path.before, old.path.after]){
    if(url) URL.revokeObjectURL(url);
  }
  if(document.getElementById('record-body')) renderRecordBody();
}

function markMedia(id, media){
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('bangbu-media', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('marks');
    request.onerror = () => reject(request.error);
    request.onsuccess = () => {
      const db = request.result;
      const transaction = db.transaction('marks', media === undefined ? 'readonly' : 'readwrite');
      const store = transaction.objectStore('marks');
      const operation = media === undefined ? store.get(id) : media === null ? store.delete(id) : store.put(media, id);
      transaction.oncomplete = () => { db.close(); resolve(operation.result); };
      transaction.onabort = () => { db.close(); reject(transaction.error); };
    };
  });
}
let listenMediaUrls = [];
function releaseListenMedia(){
  for(const url of listenMediaUrls) URL.revokeObjectURL(url);
  listenMediaUrls = [];
}
async function mountListenMedia(id){
  const slot = document.getElementById('listenMedia');
  if(!slot) return;
  try{
    const mark = findMark(id);
    if(mark?.cloudMedia){
      slot.textContent = '正在读取现场原声…';
      await renderCloudMedia(slot,mark.cloudMedia);
      return;
    }
    const media = await markMedia(id);
    if(!slot.isConnected) return;
    if(!media?.audio) throw new Error('Audio missing');
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.preload = 'metadata';
    audio.setAttribute('aria-label','现场原声');
    audio.style.width = '100%';
    audio.src = URL.createObjectURL(media.audio);
    listenMediaUrls.push(audio.src);
    audio.onplay = () => {
      window.speechSynthesis?.cancel();
      window.BangbuDevice?.stopSpeaking();
    };
    slot.textContent = '现场原声';
    slot.append(audio);
    for(const [key, label] of [['before','清理前'], ['after','清理后']]){
      if(!media.photos?.[key]) continue;
      const photo = document.createElement('img');
      photo.alt = label;
      photo.style.maxWidth = '45%';
      photo.src = URL.createObjectURL(media.photos[key]);
      listenMediaUrls.push(photo.src);
      slot.append(photo);
    }
  }catch(e){
    if(slot.isConnected) slot.textContent = '原声暂时无法读取，可以播放文字播报。';
  }
}
function isSample(mark){
  return seed.some(item => item.id === mark.id);

function markAge(mark){
  const days = mark.createdAt ? Math.max(0, Math.floor((Date.now() - mark.createdAt) / 86400000)) : mark.days;
  return isSample(mark) ? '示例路标' : days === 0 ? '今天' : `${days} 天前`;
}

    const r = new SR();

    r.onresult = e => {
      const q = e.results[0][0].transcript;

      if(hit){ toast('找到：' + hit.place); playAndOpen(hit.id); }
      else { toast('没有找到“' + q + '”，试试“地铁”“电梯”'); }
    };
    r.onerror = () => toast('没有听清，请再试一次');
    r.start();
    toast('请说出地点，例如“地铁 C 口”');
  }catch(e){ toast('语音搜索不可用，请用列表'); }
}

/* ---------- init ---------- */
(async function init(){
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) stopMic(rec);
  });
  const qs = new URLSearchParams(location.search);
  const role = qs.get('role');
  if(['volunteer','blind','lowvision','admin'].includes(role)){
    state.role = role;
    const d = roleDefaults(role);
    state.settings.theme = d.theme;
    state.settings.font = d.font;
  }
  if(qs.get('theme')) state.settings.theme = qs.get('theme');
  if(qs.get('font')) state.settings.font = qs.get('font');
  if(qs.get('cvd')) state.settings.cvd = qs.get('cvd');
  saveState();
  await initCloud();

  if(!state.role){ showGate(); return; }
  hideGate();
  applySettings();
  renderTabbar();
  const hash = (location.hash || '').replace('#','');
  if(state.role === 'admin') go('review');
  else if(hash.startsWith('listen-')){
    const id = Number(hash.slice(7));
    if(!findMark(id)) await refreshRoutes();
    speakOnOpen = state.role !== 'volunteer';
    go('listen',id);
  }
  else if(['nearby','record','messages','me','help'].includes(hash)) go(hash);
  else go('nearby');

})();
</script>
